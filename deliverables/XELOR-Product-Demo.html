.ring .bg{stroke:var(--surface-3)} .ring .fg{stroke:var(--role);stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1s var(--out)}
.ring text{font-family:var(--display);font-weight:800;font-size:15px;fill:var(--ink)}
.feedline{display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;padding:8px 0;position:relative}
.feedline::before{content:"";position:absolute;left:5px;top:20px;bottom:-8px;width:2px;background:var(--line)}
.feedline:last-child::before{display:none}
.feedline .d{width:12px;height:12px;border-radius:50%;background:var(--role);margin-top:4px;box-shadow:0 0 0 3px var(--role-soft);z-index:1}
.feedline b{display:block;font-size:13.5px;color:var(--ink)} .feedline small{font-size:11.5px;color:var(--muted)}
.feedline.new{animation:factin 1.2s var(--ease)}

/* floor app */
.counter{display:flex;align-items:center;justify-content:center;gap:16px}
.counter b{font-family:var(--display);font-weight:800;font-size:56px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1;min-width:120px;text-align:center}
.counter b small{font-size:18px;color:var(--muted)}

/* time skip veil */
.veil{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:20px;background:color-mix(in srgb,var(--deep) 62%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);animation:fadein .35s var(--ease) both;cursor:pointer}
.veil.out{animation:fadeout .45s var(--ease) both}
@keyframes fadeout{to{opacity:0}}
.skip{text-align:center;color:#fbf6e8;display:flex;flex-direction:column;align-items:center;gap:8px}
.skip small{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#f0c95f;font-weight:700}
.skip h2{font-size:clamp(34px,5vw,58px);color:#fbf6e8;letter-spacing:-.04em}
.skip p{font-size:15px;color:#e6d6dc;max-width:46ch}
.cal{width:118px;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);animation:calflip .9s var(--spring) both;transform-origin:top center}
.cal i{display:block;font-style:normal;background:#c0392b;color:#fff;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.12em;padding:7px 0;text-transform:uppercase}
.cal b{display:block;font-family:var(--display);font-size:54px;color:#1d1418;line-height:1.15;padding:4px 0 8px;font-variant-numeric:tabular-nums}
@keyframes calflip{0%{transform:perspective(500px) rotateX(-95deg);opacity:0}100%{transform:none;opacity:1}}

/* Dynamic Island live activity */
.frame.phone .island{transition:width .55s var(--spring),height .55s var(--spring),border-radius .55s var(--spring),top .55s var(--spring);overflow:hidden;display:flex;align-items:center}
.frame.phone .island.live{width:372px;height:78px;border-radius:40px;top:20px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.frame.phone .island .la{display:flex;gap:11px;align-items:center;padding:0 16px 0 14px;width:100%;opacity:0;transition:opacity .2s;color:#fff;min-width:0}
.frame.phone .island.live .la{opacity:1;transition:opacity .35s .2s}
.frame.phone .island.live i{opacity:0}
.island .la .li{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:0 0 auto;background:linear-gradient(150deg,#b23a5e,#7a2945);color:#fff}
.island .la b{display:block;font-family:-apple-system,"SF Pro Text",var(--sans);font-size:14px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.island .la small{display:block;font-size:12.5px;color:#c7c7cc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.island .la > div{min-width:0;flex:1}
.island .la .now{font-size:11px;color:#8e8e93;align-self:flex-start;margin-top:16px}

/* phone push / pop navigation */
.push{animation:pushin .42s var(--out) both}
.pop{animation:popin .42s var(--out) both}
@keyframes pushin{from{opacity:.2;transform:translateX(28%)}}
@keyframes popin{from{opacity:.2;transform:translateX(-22%)}}
/* liquid tab bar indicator */
.tabbar{position:absolute}
.tabbar .ind{position:absolute;top:5px;bottom:5px;left:5px;border-radius:28px;background:color-mix(in srgb,var(--role) 15%,transparent);transition:transform .5s var(--spring),width .5s var(--spring);pointer-events:none;z-index:0}
.tabbar button{z-index:1}
.tabbar button[aria-current="page"]{background:transparent}
/* portal tab glide */
.pside{position:relative}
.ptab{position:relative;z-index:1}

/* summary */
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@container vp (max-width:720px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
.summary > div{border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:12px;padding:12px;background:var(--surface)}
.summary b{display:block;font-family:var(--display);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.summary small{font-size:11.5px;color:var(--muted)}
.closing{background:linear-gradient(135deg,var(--deep),color-mix(in srgb,var(--deep) 70%,var(--acc)));color:var(--on-deep);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.closing::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;border:24px solid color-mix(in srgb,#f0c95f 20%,transparent)}
.closing h4{color:#fbf6e8;font-size:19px;position:relative}
.closing p{color:var(--deep-sub);font-size:13px;position:relative;max-width:70ch}
.closing .summary > div{background:rgba(255,255,255,.06);border-color:rgba(240,201,95,.3)}
.closing .summary b{color:#f0c95f}.closing .summary small{color:var(--deep-sub)}

/* toast tones */
.toast .ti.bad{background:#ec7d64;color:#1c0905}
.toast .ti.info{background:#80b3e2;color:#08131f}
.toast .ti.warn{background:#dd9650;color:#1a0f05}
.toast b{color:#fbf6e8;display:block}
.toast small{display:block;color:var(--deep-sub);font-size:12px;line-height:1.35}
.toast.bad::after{background:#ec7d64}.toast.info::after{background:#80b3e2}.toast.warn::after{background:#dd9650}

/* stores scan */
.scanbox{position:relative;border-radius:14px;overflow:hidden;background:var(--deep);aspect-ratio:16/7;max-width:100%;display:grid;place-items:center;color:var(--deep-sub)}
.scanbox .doc{width:58%;height:70%;background:#f6f1e7;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.4);padding:10px 12px;display:flex;flex-direction:column;gap:5px;color:#2a1a10;font-family:var(--mono);font-size:9px}
.scanbox .doc i{display:block;height:4px;border-radius:2px;background:#d8ccb8}
.scanbox .doc i.w{width:60%}
.scanbox .beam{position:absolute;left:8%;right:8%;height:2px;background:#f0c95f;box-shadow:0 0 18px 4px rgba(240,201,95,.6);top:15%;animation:beam 1.6s ease-in-out infinite alternate}
.scanbox.ok .beam{display:none}
.scanbox .okm{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;font-size:18px;animation:lvpop .6s var(--spring)}
@keyframes beam{to{top:82%}}

@media (prefers-reduced-motion:reduce){.frame.phone .island{transition:none}.push,.pop{animation:none}}
/* tone pills */
.pill.t-ok{background:var(--green-soft);color:var(--green-ink);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.pill.t-warn{background:var(--ochre-soft);color:var(--ochre);border-color:color-mix(in srgb,var(--ochre) 45%,transparent)}
.pill.t-bad{background:var(--red-soft);color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
.pill.t-info{background:var(--blue-soft);color:var(--blue);border-color:color-mix(in srgb,var(--blue) 45%,transparent)}
.pill.t-gold{background:var(--gold-soft);color:var(--gold-ink);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.pill.t-acc{background:var(--acc-soft);color:var(--acc-ink);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.pill.t-off{background:var(--surface-3);color:var(--muted);border-color:var(--line-2)}
.ans h4 .pill,.sup .pill{flex:0 0 auto}
.r-acct .hero{background:linear-gradient(135deg,var(--deep),color-mix(in srgb,var(--deep) 70%,var(--acc)))}
.hero{background:linear-gradient(135deg,var(--deep),color-mix(in srgb,var(--deep) 62%,var(--acc)))}
.btn.gold{background:#f0c95f;color:#1d1606}
@media (max-width:720px){
  .roles{flex-wrap:nowrap;overflow-x:auto;padding:6px 2px 4px;scrollbar-width:none;flex-basis:100%}
  .rbtn{flex:0 0 auto}
  .devs{display:none}
  .resetb{margin-left:auto}
  .top-in{gap:10px}.vchip{display:none}.modes{margin-left:auto}
}
/* sticky phone CTA buttons (KisanCred pattern) */
.im-btn{border:0;border-radius:14px;height:48px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,filter .15s;flex:1;padding:0 14px}
.im-btn:active{transform:scale(.97)}
.im-btn.pri{background:var(--role);color:var(--on-role)}
.im-btn.out{background:var(--surface);border:1.5px solid var(--line-2);color:var(--ink)}
.im-btn:disabled{opacity:.45;cursor:not-allowed}
.xp-steps button:disabled{opacity:1;cursor:default}
.xp-steps button:not(.cur):not(.ok){opacity:.55}
@media (max-width:1660px){.finish > span{display:none}.finish{padding:4px}}
@media (max-width:720px){.clockchip{font-size:12px}.top-sp{display:none}}

.clockchip,.demoflag,.vchip,.themeb{flex:0 0 auto}

/* single-column stage: device centred, one-line caption, no spec panel */
.stagegrid{grid-template-columns:minmax(0,1fr)!important;justify-items:center}
.stage{width:100%}
.frame.laptop{width:min(1200px,100%)}
.stagecap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--muted);margin:2px 0 0;max-width:min(1200px,100%);text-align:center}
.stagecap b{color:var(--ink)} .stagecap .sep{color:var(--line-2)}
.stagecap .ri{width:24px;height:24px;border-radius:7px;display:inline-grid;place-items:center;background:var(--role-soft);color:var(--role-ink);font-size:13px}
/* example-view banner */
.pvbar{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 11px;border-radius:13px;background:var(--blue-soft);border:1px solid color-mix(in srgb,var(--blue) 35%,transparent);animation:scrin .4s var(--ease) both}
.pvbar .pvi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--blue);color:var(--on-blue);font-size:15px;flex:0 0 auto}
.pvbar b{display:block;font-size:13px;color:var(--ink)} .pvbar span{font-size:11.5px;color:var(--body);line-height:1.35}
.pvbar .pvgo{background:var(--blue);color:var(--on-blue);flex:0 0 auto}
.pvbar.nudge{animation:nudge .5s var(--spring)}
@keyframes nudge{0%,100%{transform:none}30%{transform:translateX(-5px)}60%{transform:translateX(4px)}}
@container vp (max-width:520px){.pvbar span{display:none}}
[data-preview] .scr > :not(.pvbar){filter:saturate(.92)}
/* ================= v6: agent + passport ================= */
.agcard{border-radius:16px;padding:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--gold-soft) 70%,var(--surface)),var(--surface) 70%);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);display:flex;flex-direction:column;gap:10px;animation:scrin .45s var(--ease) both}
.agcard b{display:block;font-family:var(--display);font-size:15px;color:var(--ink)} .agcard small{display:block;font-size:12px;color:var(--muted)}
.agmark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;color:#1d1606;background:linear-gradient(140deg,#f5d77a,#c89a2e);box-shadow:0 6px 16px -6px rgba(200,154,46,.7);flex:0 0 auto;position:relative}
.agmark::after{content:"";position:absolute;inset:-3px;border-radius:13px;border:1.5px solid color-mix(in srgb,#c89a2e 60%,transparent);animation:ping 2.2s infinite}
.agopen{background:var(--deep);color:#f0c95f;border:0}
.aglist{display:flex;flex-direction:column;gap:6px}
.ag{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:transform .18s var(--ease),border-color .2s;min-width:0}
.ag:hover{transform:translateX(2px);border-color:var(--line-2)}
.ag .agi{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:14px;flex:0 0 auto}
.ag.ask .agi{background:var(--gold-soft);color:var(--gold-ink)} .ag.work .agi{background:var(--blue-soft);color:var(--blue)} .ag.done .agi{background:var(--green-soft);color:var(--green-ink)}
.ag b{display:block;font-size:13px;color:var(--ink);line-height:1.3} .ag span{font-size:11.5px;color:var(--muted)}
.ag .pill{flex:0 0 auto}
.ag.done b{font-weight:600}
.pass{border-radius:20px;padding:18px;color:var(--on-deep);background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,#f0c95f 22%,transparent),transparent 55%),linear-gradient(150deg,#3a1424,#2a0f1a 55%,#1a0910);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden;animation:cardin .6s var(--spring) both;border:1px solid rgba(240,201,95,.25)}
.pass::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.08) 45%,transparent 60%);transform:translateX(-100%);animation:sheen 6s var(--ease) 1s infinite;pointer-events:none}
.pass-h{display:flex;gap:12px;align-items:flex-start}
.pass-h small{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#f0c95f;font-weight:700;display:block}
.pass-h h4{color:#fbf6e8;font-size:20px;margin:3px 0 2px} .pass-h span{font-size:12px;color:var(--deep-sub)}
.seal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:#1d1606;background:radial-gradient(circle at 35% 30%,#ffe9a8,#c89a2e 70%);box-shadow:0 0 0 4px rgba(240,201,95,.2);flex:0 0 auto}
.qr{width:64px;height:64px;fill:#fbf6e8;background:rgba(255,255,255,.06);border-radius:8px;padding:4px;flex:0 0 auto}
.pass-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pass-stats > div{background:rgba(255,255,255,.05);border:1px solid rgba(240,201,95,.18);border-radius:14px;padding:12px}
.pass-stats b{display:block;font-family:var(--display);font-size:28px;color:#f0c95f;font-variant-numeric:tabular-nums;line-height:1.05}
.pass-stats small{font-size:11.5px;color:var(--deep-sub);line-height:1.35;display:block;margin-top:4px}
.pass-cap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--deep-sub)} .pass-cap b{color:#fbf6e8;flex:1}
.pass-cap > span{display:inline-flex;gap:6px;align-items:center}
.pass-f{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--deep-sub);border-top:1px dashed rgba(240,201,95,.25);padding-top:10px}
@container vp (max-width:560px){.pass-stats{grid-template-columns:minmax(0,1fr)}}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.split2 h5{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.ticks{display:flex;flex-direction:column;gap:5px} .ticks li{font-size:12.5px;color:var(--body);padding-left:18px;position:relative}
.ticks li::before{content:"";position:absolute;left:2px;top:6px;width:8px;height:5px;border-left:2px solid var(--green);border-bottom:2px solid var(--green);transform:rotate(-45deg)}
.ticks.no li::before{width:9px;height:2px;border:0;background:var(--muted);transform:none;top:9px}
.vn{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:14px;background:var(--role-soft);border:1px solid color-mix(in srgb,var(--role) 35%,transparent)}
.vn b{display:block;font-size:13px;color:var(--ink)} .vn span{font-size:11.5px;color:var(--body)}
.vnb{width:42px;height:42px;border-radius:50%;border:0;background:var(--role);color:var(--on-role);display:grid;place-items:center;font-size:19px;cursor:pointer;flex:0 0 auto;box-shadow:0 6px 16px -6px var(--role);transition:transform .15s var(--spring)}
.vnb:active{transform:scale(.92)}
.vn .wave{flex:0 0 64px;height:22px} .vn .wave i{background:var(--role)}
details.json{border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
details.json summary{cursor:pointer;padding:9px 12px;font-size:12.5px;font-weight:700;color:var(--ink);display:flex;gap:6px;align-items:center}

   5% or worse is nothing. No deliveries means no record: it scores 0 and says unproven. */
function recScore(id){const o=onTimePct(id),r=rejPct(id);if(o==null)return 0;return 0.7*(o/100)+0.3*Math.max(0,1-r/5)}

  case 'dispatch':return !!S.dispatch&&!!S.dispatch.irn;

/* =====================================================================
   Ranking. Computed, never typed: delivery 40%, landed price 35%,
   track record 25%. An answer promised after the need date is unusable.
   ===================================================================== */
function ranked(){
  const rows=Object.keys(S.rfq.quotes).map(id=>{const q=S.rfq.quotes[id];const landed=q.unit*NEED_QTY+(q.freight||0);const late=!!q.date&&q.date>RFQ.need;const lead=q.date?Math.max(1,days('2026-09-30',q.date)):null;return Object.assign({id,s:SUP[id],landed,late,lead},q)});
  const usable=rows.filter(r=>!r.late);const best=usable.length?Math.min(...usable.map(r=>r.landed)):0;
  const dated=usable.filter(r=>r.lead);const bestLead=dated.length?Math.min(...dated.map(r=>r.lead)):0;
  rows.forEach(r=>{r.cost=best?Math.min(1,best/r.landed):0;r.speed=r.late||!r.lead?0:bestLead/r.lead;r.rec=recScore(r.id);
    r.expRej=rejPct(r.id)==null?null:NEED_QTY*rejPct(r.id)/100;r.score=r.late?-1:W.speed*r.speed+W.cost*r.cost+W.rec*r.rec});
  rows.sort((a,b)=>b.score-a.score||a.landed-b.landed);let n=0;rows.forEach(r=>{r.rank=r.late?null:++n});return rows}

  box.appendChild(t);while(box.children.length>3)box.firstChild.remove();setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),400)},4200)}

  arrive(id){if(S.rfq.status!=='sent'||S.rfq.quotes[id]||!S.rfq.to.includes(id))return false;const a=SUP[id].auto;if(!a)return false;tick(id==='anand'?25:30);

/* short deterministic hash for idempotency keys and the audit chain (FNV-1a, display only) */
function hx(s,n=64){let out='';for(let r=0;out.length<n;r++){let h=(0x811c9dc5^r)>>>0;for(const c of s+'#'+r){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}out+=h.toString(16).padStart(8,'0')}return out.slice(0,n)}
const hshort=h=>h.slice(0,8)+'…'+h.slice(-6);

function ensureUpTo(i){const q=QUIET;QUIET=true;for(let j=0;j<i;j++){if(TOUR[j].enter)TOUR[j].enter();QUIET=true;if(!TOUR[j].done())TOUR[j].run()}QUIET=q}
function tourGo(i){if(i<0||i>=TOUR.length)return;ensureUpTo(i);ui.tour=i;const s=TOUR[i];if(s.enter)s.enter();setRole(s.role,true,false);ui.navDir=null;ui.scr[s.role]=s.scr;if(PHONE_ROLES.includes(s.role))ui.hist[s.role]=[];render();
  document.querySelector('.stagegrid')?.scrollIntoView({behavior:reduceMotion()?'auto':'smooth',block:'nearest'})}
function tourNext(){const s=TOUR[ui.tour];if(s&&!s.done()){s.run();render();return}if(ui.tour<TOUR.length-1)tourGo(ui.tour+1);else{ui.tour=-2;render()}}

/* ---------- example views: every module shows something, even before the order reaches it ---------- */
/* A screen whose data doesn't exist yet is drawn from a copy of the demo run forward to that point.
   Nothing in the real demo changes; buttons in an example view are inert until you make it real. */
function previewOf(sc){const p=PV[sc.id];if(!p)return null;const [req]=p;return TOUR[req-1].done()?null:p}
function withState(st,fn){const s0=S,t0=TIMERS,q0=QUIET;S=st;TIMERS=[];QUIET=true;try{return fn()}finally{TIMERS.forEach(clearTimeout);S=s0;TIMERS=t0;QUIET=q0}}
function futureState(p){return withState(JSON.parse(JSON.stringify(S)),()=>{ensureUpTo(p[1]);A.arriveAll();if(p[2])p[2]();sweep();return S})}
function pvBanner(p){return `<div class="pvbar"><span class="pvi">${I('eye')}</span><div class="grow"><b>Example view</b><span>Filled in as if the order had reached this point. It becomes real after “${esc(TOUR[p[0]-1].t)}”.</span></div><button class="btn sm pvgo" data-jump="${p[0]}">Show it for real${I('arrow')}</button></div>`}
function jumpTo(n){ensureUpTo(n);toast('Done up to here','The steps before this screen ran, so it now shows the live order.');render()}

/* ---------- shell rendering ---------- */
function setRole(r,autoDev=true,doRender=true){if(ui.role!==r&&S.unread[r]!=null&&r!=='sup')S.unread[r]=0;ui.role=r;if(autoDev)ui.dev=ROLES[r].dev;if(r==='sup'&&ui.scr.sup==='s.chat')S.unread.sup=0;if(doRender)render()}
function go(id){const sc=SCREENS[id];if(!sc)return;const r=sc.role;if(r!==ui.role)setRole(r,true,false);
  if(PHONE_ROLES.includes(r)&&ui.scr[r]!==id){ui.hist[r].push(ui.scr[r]);ui.navDir='push'}else ui.navDir=null;
  ui.scr[r]=id;if(id==='s.chat')S.unread.sup=0;render()}
function back(){const r=ui.role,h=ui.hist[r];if(h&&h.length){ui.scr[r]=h.pop();ui.navDir='pop';render()}}

    if(S.rfq.status==='sent'){const miss=S.rfq.to.filter(id=>!S.rfq.quotes[id]);if(miss.length)waiting.push(['Waiting on '+miss.length+' supplier'+(miss.length>1?'s':''),miss.map(id=>SUP[id].short).join(', ')+' · reply by '+dmy(RFQ.replyBy),'msg'])}

    if(S.po&&S.po.status==='approved'&&!S.grn)waiting.push(['Waiting on '+SUP[S.po.sup].short,NEED_QTY+' castings promised for '+dmy(S.po.promised),'truck']);
    if(S.wo&&S.wo.status!=='done')waiting.push(['Waiting on the shop floor',S.wo.no+' · '+(S.wo.status==='issued'?'assembling':'final test'),'factory']);
    return `${head(hi+', Priya.','One order is moving through the factory. Every module you open is looking at the same record.')}
    ${routeCard()}
    <div class="kpis"><div class="kpi hl"><b>${cu(INVOICE_TOTAL,'inr')}</b><span>order value, incl. IGST</span></div><div class="kpi"><b>${dmy(ORDER.due)}</b><span>due to ship · ${left>0?left+' days away':'today'}</span></div><div class="kpi"><b>${S.planRun?(S.inspection==='pass'?'0':'1'):'—'}</b><span>${S.planRun?(S.inspection==='pass'?'short parts · all covered':NEED_QTY+' pump bodies short'):'run planning to find out'}</span></div><div class="kpi"><b>${Object.keys(S.stamped).length} / 9</b><span>stations stamped</span></div></div>
    <div class="two"><div class="hero"><span class="eyb">${n.done?'Done':'Next · station '+(c+1)}</span><h4>${esc(n.t)}</h4><p>${n.done?'Typed once, carried through nine stations. Start over to run it again.':'XELOR suggests the next move. You decide.'}</p><div><button class="btn gold sm" data-go="${n.go}">${esc(n.b)}${I('arrow')}</button></div></div>
    ${card('Waiting on others',null,waiting.length?`<div class="list">${waiting.map(w=>`<div class="act"><span class="ai g">${I(w[2])}</span><div class="grow"><b style="color:var(--ink);font-size:13.5px">${esc(w[0])}</b><div class="sub">${esc(w[1])}</div></div></div>`).join('')}</div>`:`<p class="sub">Nobody. The next move is yours.</p>`)}</div>`}});

def('p.sales',{role:'pur',title:'Sales order',route:'/sales/orders/SO-2627-0291',purpose:'The customer’s PO, entered once. The credit check runs before confirming, not at dispatch. Confirming makes the order visible to planning, stores, production and accounts.',
  reads:['Customer master + GSTIN','Outstanding receivables','Item, HSN, price list'],api:[['Order','GET /api/v1/sales/orders/{id}'],['Outstanding','GET /api/v1/accounts/customers/{id}/outstanding'],['Confirm','POST /api/v1/sales/orders/{id}/confirm (Idempotency-Key)']],

    <div class="two"><div class="docsheet"><div class="dh"><div><h4>Sales order</h4><div class="no">${ORDER.no} · against ${ORDER.custPo}</div></div>${ok?stampHtml('Confirmed',S.stamped[0],false,true,S.justStamped===0):tp('Not confirmed','warn')}</div>
      <div class="parties"><div><small>Customer</small><b>${esc(CUSTOMER.name)}</b><br>${esc(CUSTOMER.town)}<br><span class="mono" style="font-size:11px">${CUSTOMER.gstin}</span></div><div><small>Ship by</small><b>${dmyy(ORDER.due)}</b><br>${CUSTOMER.km} km by road<br>Payment ${CUSTOMER.terms} days</div></div>
      <div class="scx"><table class="tbl"><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead><tbody>
      <tr><td><b>${esc(ORDER.item)}</b><div class="s mono">${ORDER.code} · HSN ${ORDER.hsn}</div></td><td class="r num">${ORDER.qty}</td><td class="r num">${inr(ORDER.price)}</td><td class="r num">${inr(TAXABLE)}</td></tr>
      <tr><td colspan="3" class="r s">IGST 18% · Karnataka to Andhra Pradesh</td><td class="r num">${inr(IGST)}</td></tr>
      <tr class="tot"><td colspan="3" class="r">Total</td><td class="r num">${inr(INVOICE_TOTAL)}</td></tr></tbody></table></div>
      ${ok?'':`<button class="btn pri" data-a="confirmOrder">${I('check')}Confirm order</button>`}</div>
    <div class="card"><h4>Credit check</h4><p class="sub">Done before confirming, not at dispatch</p>${kv('Credit limit',inr(CUSTOMER.limit))}${kv('Already owed',inr(CUSTOMER.outstanding))}${kv('This order',inr(INVOICE_TOTAL))}${kv('After this order',inr(after))}
      <div class="bar" style="grid-template-columns:minmax(0,1fr) 50px"><span class="tr"><i style="width:${pct}%;background:var(--green)"></i></span><b>${pct}%</b></div>${tp('Within limit','ok')}</div></div>
`}});

def('p.plan',{role:'pur',title:'Material check',route:'/planning/mrp/runs/latest',purpose:'XELOR explodes the confirmed order through its bill of materials and compares every part with this morning’s shelf. A shortage becomes a suggestion to ask suppliers, with the evidence written under it.',
  reads:['BOM v4 for KP-PMP-6ES','Stock by bin','Machining and assembly lead time'],api:[['Run MRP','POST /api/v1/planning/mrp/run'],['Explain a line','GET /api/v1/planning/mrp/runs/{runNo}/explain/{itemCode}'],['Exceptions','GET /api/v1/planning/exceptions']],
  states:['no confirmed order','ready to plan','short parts found','all covered'],rules:['Shortage = need − on shelf; never a guess','Need date = ship date − 11 days to machine and assemble','XELOR suggests; the planner decides'],
  render(){if(S.order==='received')return head('Material check','What the order needs, part by part, against the shelf.')+waitFor(0,'No confirmed order to plan yet');
    if(!S.planRun)return head('Material check','What '+ORDER.qty+' pumps need, part by part, against what is on the shelf this morning.')+empty('chart',ORDER.no+' is ready to plan','XELOR explodes the pump into its six parts and checks each against stock.',`<button class="btn pri" data-a="runPlan">${I('chart')}Check materials</button>`);
    const rows=BOM.map(b=>{const need=ORDER.qty*b.per,have=b.stock+(b===SHORT&&S.inspection==='pass'?NEED_QTY:0);return{b,need,have,short:Math.max(0,need-have)}});
    return `${head('Material check',`What ${ORDER.qty} pumps need, part by part, against the shelf. From BOM version 4.`)}
    <div class="scx"><table class="tbl"><thead><tr><th>Part</th><th class="r">Per pump</th><th class="r">Needed</th><th class="r">On shelf</th><th class="r">Short</th><th>Status</th></tr></thead><tbody>
    ${rows.map(r=>`<tr class="${r.short?'hot':''}"><td><b>${esc(r.b.name)}</b><div class="s mono">${r.b.code} · bin ${r.b.bin}</div></td><td class="r num">${r.b.per}</td><td class="r num">${nos(r.need)}</td><td class="r num">${nos(r.have)}</td><td class="r num"><b>${r.short?nos(r.short):'—'}</b></td><td>${r.short?tp('Short','bad'):tp('Covered','ok')}</td></tr>`).join('')}</tbody></table></div>
    ${S.inspection==='pass'?`<div class="card ok"><h4>Covered</h4><p class="sub">The 60 castings arrived and passed inspection, so every part is on the shelf.</p></div>`:
    `<div class="card gold"><div class="eyb" style="color:var(--gold-ink)">${I('spark')} Suggestion</div><h4>Ask three casting suppliers for ${NEED_QTY} pump bodies</h4><p class="sub">To ship on ${dmy(ORDER.due)} the castings must be here by ${dmy(RFQ.need)}. Three foundries on the network pour grey iron.</p>
      <div class="btns" style="justify-content:flex-start">${S.rfq.status==='none'?`<button class="btn pri sm" style="flex:0 0 auto" data-go="p.net">${I('send')}Ask suppliers for a price</button>`:`${tp('Request already sent','ok')} <button class="btn gh sm" style="flex:0 0 auto" data-go="p.net">See the answers</button>`}</div></div>`}`}});

function packCard(){const rows=[['Part',SHORT.name+', 6 in','item master '+SHORT.code],['Quantity',NEED_QTY+' nos','material check: 80 needed − '+SHORT.stock+' on shelf'],['Needed by',dmyy(RFQ.need),'ship '+dmy(ORDER.due)+' − 11 days'],['Drawing','Rev A, machining allowance 3 mm','item attachments'],['Checked on arrival',QPLAN.checks.length+' checks, sample '+QPLAN.sample,QPLAN.no],['Deliver to',FACTORY.town,'factory master']];
  return card('The request, already written','Priya typed nothing below',`<div class="list" style="gap:0">${rows.map((r,i)=>`<div class="kv" style="animation:scrin .4s var(--ease) ${i*60}ms both"><span>${esc(r[0])}</span><b>${esc(r[1])}<span class="mono" style="display:block;font-size:10px;color:var(--muted);font-weight:500">from ${esc(r[2])}</span></b></div>`).join('')}</div>`)}
function rfqBubble(preview){const open=!preview&&S.rfq.status==='sent'&&!S.rfq.quotes.ganesh;
  return `<div class="bub"><div class="from">${esc(FACTORY.name)}</div>Request for quotation <b>${RFQ.no}</b><dl><dt>Part</dt><dd>${esc(SHORT.name)}, 6 in</dd><dt>Quantity</dt><dd>${NEED_QTY} nos</dd><dt>Needed by</dt><dd>${dmyy(RFQ.need)}</dd><dt>Reply by</dt><dd>${dmyy(RFQ.replyBy)}</dd><dt>Drawing</dt><dd>Rev A · on the link</dd></dl>Machining allowance 3 mm all over. Our pattern.
  <div style="margin-top:6px;padding-top:6px;border-top:1px dashed var(--line-2);font-size:12px"><b>How we check it on arrival</b> (${QPLAN.sample})<ul>${QPLAN.checks.map(c=>`<li>${esc(c[0])}: ${esc(c[1])}</li>`).join('')}</ul></div>
  ${preview?`<span class="go dim">${I('link')}Quote in one minute</span>`:open?`<button class="go" data-go="s.quote">${I('link')}Quote in one minute</button>`:`<span class="go dim">${S.rfq.quotes.ganesh?'Quoted · tap Quote to change it':'Request closed'}</span>`}
  <div class="t">${preview?'preview':tm(S.supMsgs[0]?S.supMsgs[0].at:S.clock)}</div></div>`}
function ansRow(r){const s=r.s,awarded=S.po&&S.po.sup===r.id;let act='';
  if(S.rfq.status==='sent'){if(r.late)act=`<div class="aact"><button class="btn gh sm" disabled>Award</button><small style="color:var(--red)">Misses ${dmy(RFQ.need)}</small></div>`;
    else if(!s.vendor)act=`<div class="aact"><button class="btn gh sm" data-a="award" data-id="${r.id}">Award</button>${S.invited[r.id]?tp('Invited to claim its record','info'):`<button class="btn gh sm" data-a="invite" data-id="${r.id}">${I('link')}Invite to claim its record</button>`}<small style="color:var(--ochre)">Not an approved vendor yet · a trial order starts its record</small></div>`;
    else act=`<div class="aact"><button class="btn ${r.rank===1?'pri':'gh'} sm" data-a="award" data-id="${r.id}">${I('award')}Award</button><small>${r.rank===1?'Top of the ranking':'Allowed, but not the top answer'}</small></div>`}
  else if(awarded)act=`<div class="aact">${tp('Awarded · '+S.po.no,'ok')}</div>`;
  const lead=r.late?`Promised ${dmy(r.date)}, after the need date, so it can’t be used however cheap.`:r.date?`Promised ${dmy(r.date)}, ${days(r.date,RFQ.need)} day${days(r.date,RFQ.need)===1?'':'s'} before it’s needed.`:'No delivery date given, so it scores nothing for delivery.';
  const o=onTimePct(r.id);
  const proof=o==null?`<div class="proof unk">${I('alert')}<span><b style="color:inherit">Unproven.</b> Never delivered to Kaveri, so its promise is taken on trust and its record scores 0.</span></div>`
    :`<div class="proof"><span>Record: <b>${Math.round(o)}%</b> of ${H(r.id).deliveries} deliveries on time · <b>${rejPct(r.id).toFixed(1)}%</b> rejected → expect about <b>${r.expRej.toFixed(1)}</b> of ${NEED_QTY} to fail inspection</span><span>${s.xelor?`Capacity: <b>${esc(s.xelor.free)}</b>, read live from their XELOR`:'Capacity: as stated in the reply'}</span></div>`;
  const m=(k,v,w,c)=>`<div><div class="mk">${k}</div><div class="mv">${v}</div>${w!=null?`<div class="bar-s"><i style="width:${Math.round(w*100)}%;background:${c}"></i></div>`:''}</div>`;
  return `<div class="ans ${r.late?'late':''} ${awarded?'won':''}" data-flip="${r.id}"><span class="rank ${r.rank===1?'first':''}">${r.late?'✕':r.rank}</span><div class="b">
    <h4>${esc(s.name)}${s.xelor?vbadge():''}${s.vendor?'':tp('Network only','warn')}${r.fresh&&r.id==='ganesh'?tp('Just quoted','acc'):''}${r.id==='anand'?tp('Agent reply · API','info'):r.id==='veera'?tp('Simulated reply'):''}</h4>
    <p class="why">${esc(lead+' '+(r.note||''))}</p>${proof}
    <div class="mets">${m('Landed',inr(r.landed))}${m('Per piece',inr2(r.unit))}${m('Delivery',r.speed.toFixed(2),r.speed,'var(--acc)')}${m('Price',r.cost.toFixed(2),r.cost,'var(--blue)')}${m('Record',r.rec.toFixed(2),r.rec,'var(--gold)')}${m('Score',r.late?'—':r.score.toFixed(2))}</div>${act}</div></div>`}
def('p.net',{role:'pur',title:'Supplier network',route:'/purchase/network/rfqs/RFQ-2627-0114',purpose:'Ask foundries for a price and get the answers back ranked. The request is written from records XELOR holds; each supplier shows its earned record and, when it runs XELOR, live capacity. Ranking weighs delivery, landed cost and track record, and explains itself.',
  reads:['Item master, BOM, quality plan QP-BDY-150','Vendor approval status','Supplier performance from Kaveri’s receipts and inspections','Live capacity (suppliers on XELOR)'],
  api:[['Create RFQ','POST /api/v1/purchase/rfqs'],['Issue + broadcast','POST /api/v1/purchase/network/rfqs/{id}/broadcast'],['Performance','GET /api/v1/purchase/network/suppliers/{id}/performance'],['Ranking','GET /api/v1/purchase/network/rfqs/{id}/ranking'],['Award → PO','POST /api/v1/purchase/rfqs/{id}/award']],
  states:['nothing short','choose who to ask','waiting for replies','ranked','late answer (unusable)','award refused (not a vendor)','awarded'],
  rules:['Anyone on the network can quote; only an approved vendor can be awarded','An answer after the need date is unusable however cheap','Track record is counted, never typed; no record scores 0 and says unproven','Messages are composed, not delivered, in this demo'],
  render(){
    if(!S.planRun)return head('Supplier network','Every foundry this factory can ask for a price, and what each one has actually delivered.')+waitFor(1,'Nothing to ask for yet');
    if(S.rfq.status==='none'){const n=SUP_ORDER.filter(id=>ui.pick[id]).length;
      return `${head('Ask for a price','XELOR wrote the request from records it already holds. Choose who to ask. They answer from a link with no login.')}
      <div class="two"><div class="card"><h4>Who to ask</h4><p class="sub">Suppliers who pour grey iron castings</p><div class="list">${SUP_ORDER.map(id=>{const s=SUP[id];return `<div class="sup ${ui.pick[id]?'on':''}" role="checkbox" tabindex="0" aria-checked="${!!ui.pick[id]}" data-a="pick" data-id="${id}"><span class="cbx">${I('check')}</span>${logo(id)}<span class="tx"><b>${esc(s.name)}${s.xelor?vbadge():''}</b><small>${esc(s.town)} · ${s.km} km · replies in about ${s.reply}</small><span class="stats">${recLine(id)}</span>${capLine(id)}</span>${s.vendor?tp('Approved','ok'):tp('Network only','warn')}</div>`}).join('')}</div>
        <button class="btn pri block" data-a="sendRfq" ${n?'':'disabled'}>${I('send')}Send request to ${n} supplier${n===1?'':'s'}</button></div>
      <div style="display:flex;flex-direction:column;gap:12px;min-width:0">${packCard()}${card('What each supplier receives','A message with a private link, and the same request for supplier software',`<div class="thread" style="margin:0;border-radius:12px;min-height:0">${rfqBubble(true)}</div><details class="json"><summary>${I('link')} Machine-readable request · for supplier order-desk agents</summary><pre>${esc(JSON.stringify({rfq:RFQ.no,item:SHORT.code,qty:NEED_QTY,need_by:RFQ.need,reply_by:RFQ.replyBy,deliver_to:'Peenya, Bengaluru 560058',quality_plan:QPLAN.no,quote_url:'https://kaveri.xelor.in/q/…'},null,1))}</pre></details>`)}</div></div>`}
    const rows=ranked(),miss=S.rfq.to.filter(id=>!S.rfq.quotes[id]),usable=rows.filter(r=>!r.late);
    return `${head('Answers for '+RFQ.no,`${NEED_QTY} × ${esc(SHORT.name)} · needed by ${dmyy(RFQ.need)} · ranked on delivery, landed cost and each supplier’s real record.`)}
    <div class="kpis"><div class="kpi hl"><b>${rows.length} of ${S.rfq.to.length}</b><span>${miss.length?'answers in · reply by '+dmy(RFQ.replyBy):'everyone answered'}</span></div><div class="kpi"><b>${usable.length?inr(Math.min(...usable.map(r=>r.landed))):'—'}</b><span>best landed cost, before GST</span></div><div class="kpi"><b>${usable.length>1?inr(Math.max(...usable.map(r=>r.landed))-Math.min(...usable.map(r=>r.landed))):'—'}</b><span>spread, best to worst</span></div><div class="kpi"><b>${rows.filter(r=>onTimePct(r.id)!=null).length} of ${rows.length}</b><span>answers backed by deliveries</span></div></div>
    
    <div class="card"><div class="row sb"><h4>Ranked answers</h4><span class="sub">The ranking explains; you decide</span></div>
      <div class="weights"><i style="flex:${W.speed};background:var(--acc)"></i><i style="flex:${W.cost};background:var(--blue);animation-delay:.08s"></i><i style="flex:${W.rec};background:var(--gold);animation-delay:.16s"></i></div>
      <div class="weights-k"><span style="--c:var(--acc)">Delivery promised 40%</span><span style="--c:var(--blue)">Landed cost 35%</span><span style="--c:var(--gold)">Track record 25%</span></div></div>
    <div class="list">${rows.map(ansRow).join('')}${miss.map(id=>`<div class="ans wait" data-flip="${id}"><span class="rank">·</span><div class="b"><h4>${esc(SUP[id].name)}</h4><p class="why">${SUP[id].live?`Answering on the phone. <button class="linkbtn" data-go="s.quote">Open Sri Ganesh’s phone</button> to send the quote.`:`Waiting for a reply <span class="tdots"><i></i><i></i><i></i></span>`}</p></div></div>`).join('')}</div>`}});

def('p.po',{role:'pur',title:'Purchase orders',route:'/purchase/orders/PO-2627-00415',purpose:'The purchase order raised straight from the award, checked against Priya’s approval limit. Above it, the order goes to the owner’s phone; the person who awards never approves.',
  reads:['Award + ranked answer','Approval limits by person','Supplier Udyam status'],api:[['PO','GET /api/v1/purchase/orders/{id}'],['Submit for approval','POST /api/v1/purchase/orders/{id}/submit'],['Approve (owner)','POST /api/v1/purchase/orders/{id}/approve'],['History','GET /api/v1/purchase/orders/{id}/history']],
  states:['no PO yet','awaiting approval','approved and sent','sent back'],rules:['Limit is a rule, not a warning: Priya can’t approve above ₹1,50,000','Maker–checker: the awarder never approves','Every state change is in the order’s history'],
  render(){if(!S.po)return head('Purchase orders','Raised from an award, checked against the buyer’s limit.')+waitFor(3,'No purchase order yet');const p=S.po,s=SUP[p.sup],ap=p.status==='approved';
    const steps=[['Raised by Priya from the award',stamp(p.raised),'done'],[p.needsOwner?`Above Priya’s ${inr(PEOPLE.priya.limit)} limit, so it goes to Arun`:'Within Priya’s limit',p.needsOwner?'The person who awards never approves':'No second signature needed','done'],
      [ap?'Approved by '+p.approvedBy:'Waiting on Arun Venkatesh, owner',ap?stamp(S.stamped[4]):'On his phone now',ap?'done':'now'],['Sent to '+s.short,ap?`Deliver ${NEED_QTY} by ${dmy(p.promised)}`:'After approval',ap?'done':'']];
    return `${head('Purchase order '+p.no,ap?'Approved and with the supplier. Stores will receive against it.':'Raised straight from the award. Nothing was retyped.')}
    <div class="two"><div class="docsheet"><div class="dh"><div><h4>Purchase order</h4><div class="no">${p.no} · from ${RFQ.no}</div></div>${ap?stampHtml('Approved',S.stamped[4],false,true,S.justStamped===4):tp('Awaiting approval','warn')}</div>
      <div class="parties"><div><small>Supplier</small><b>${esc(s.name)}</b><br>${esc(s.town)}<br>Udyam: ${s.msme} enterprise</div><div><small>Deliver to</small><b>${esc(FACTORY.name)}</b><br>${FACTORY.town}<br>by ${dmyy(p.promised)}</div></div>
      <div class="scx"><table class="tbl"><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead><tbody>
      <tr><td><b>${esc(SHORT.name)}</b><div class="s mono">${SHORT.code}</div></td><td class="r num">${NEED_QTY}</td><td class="r num">${inr2(p.unit)}</td><td class="r num">${inr(p.unit*NEED_QTY)}</td></tr>
      ${p.freight?`<tr><td>Freight to Peenya</td><td></td><td></td><td class="r num">${inr(p.freight)}</td></tr>`:''}
      <tr><td colspan="3" class="r s">IGST 18% · ${p.sup==='veera'?'Karnataka, intra-state':'Tamil Nadu to Karnataka'}</td><td class="r num">${inr(p.gst)}</td></tr>
      <tr class="tot"><td colspan="3" class="r">Total</td><td class="r num">${inr(p.total)}</td></tr></tbody></table></div></div>
    <div class="card"><h4>Approval</h4>${pipeHtml(steps)}${p.status==='awaiting'?`<button class="btn pri block" data-go="w.po">${I('phone')}Open Arun’s phone</button><p class="note center">Priya can’t approve it herself. The limit is a rule, not a warning.</p>`:''}</div></div>`}});

function scorecard(){return `<div class="scx"><table class="tbl"><thead><tr><th>Supplier</th><th class="r">Deliveries</th><th class="r">On time</th><th class="r">Pieces checked</th><th class="r">Rejected</th><th>Record</th><th>Status</th></tr></thead><tbody>
  ${SUP_ORDER.map(id=>{const s=SUP[id],h=H(id),base=s.hist,o=onTimePct(id),rj=rejPct(id),rs=recScore(id);const dD=h&&base?h.deliveries-base.deliveries:h?h.deliveries:0,dP=h&&base?h.pieces-base.pieces:h?h.pieces:0;
  return `<tr class="${S.bumped===id?'bump':''}"><td><div class="row">${logo(id)}<div><b style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${esc(s.short)}${s.xelor?vbadge():''}</b><div class="s">${h?'since '+h.since:'never delivered to Kaveri'}</div></div></div></td>
  <td class="r num">${h?h.deliveries:0}${dD?`<span class="delta">+${dD}</span>`:''}</td><td class="r num">${o==null?'—':Math.round(o)+'%'}</td><td class="r num">${h?nos(h.pieces):0}${dP?`<span class="delta">+${dP}</span>`:''}</td><td class="r num">${rj==null?'—':rj.toFixed(1)+'%'}</td>

def('s.chat',{role:'sup',title:'Kaveri Pumps',kn:'via XELOR · business account',route:'/messages · business thread (preview)',purpose:'What the foundry actually receives: a message from Kaveri’s business number carrying the request and a private link. Award, PO, receipt and payment-due notes arrive in the same thread.',

      case 'po':return `<div class="bub"><div class="from">${esc(FACTORY.name)}</div><b>${p?p.no:''} is confirmed.</b> Please deliver ${NEED_QTY} castings to Peenya by ${p?dmyy(p.promised):''}. Reply OK to acknowledge.<div class="t">${tm(m.at)}</div></div><div class="bub me">OK. Pouring starts tomorrow on Furnace 2.<div class="t">${tm(m.at)} ✓✓</div></div>`;

def('s.record',{role:'sup',title:'My record',kn:'with Kaveri Pumps',route:'/q/:token/record',purpose:'The foundry’s own record with Kaveri, as Kaveri counts it at the gate. It shows the supplier exactly what feeds a quarter of the ranking, so keeping promises now wins work later.',

def('s.cap',{role:'sup',title:'Furnace 2',kn:'live capacity · runs XELOR',route:'/capacity · Sri Ganesh’s own XELOR',purpose:'Sri Ganesh runs XELOR in its own foundry, so its free capacity is read from its schedule and shown to buyers who ask it for a price. A promise backed by a schedule is believable.',

def('t.gate',{role:'stores',title:'Gate',route:'/stores/receipts',purpose:'Receiving against an approved PO. One scan of the challan posts the goods receipt: stock up (held for inspection), valuation, and the supplier’s on-time record. A second scan of the same challan is refused.',

      ${kv('Against','<span class="mono">'+S.po.no+'</span>')}${kv('Ordered / delivered',NEED_QTY+' / '+NEED_QTY+' nos')}${kv('On time?','<span style="color:var(--green-ink)">Yes · '+dmy(S.po.promised)+'</span>')}
      <div class="btns"><button class="btn ${g.pending?'pri':'gh'}" data-a="scan">${I('scan')}${g.pending?'Scan the challan':'Scan it again'}</button></div>${!g.pending?`<p class="note">Try it: a second scan is refused, not doubled.${S.dupScans?` Refused ${S.dupScans}×.`:''}</p>`:''}</div></div>

def('t.qc',{role:'stores',title:'Incoming inspection',route:'/quality/inspections/:id',purpose:'Latha samples the lot against the written quality plan the supplier saw before quoting. Passing releases stock and adds the pieces to the supplier’s record; rejecting holds the lot and raises a finding.',

def('a.audit',{role:'acct',title:'Audit trail',route:'/admin/audit',purpose:'Every event on the order as a hash chain: each entry carries the hash of the one before, so a changed or deleted entry breaks every link after it. Verify recomputes the chain.',

  if(S.planRun)add('done','Found '+NEED_QTY+' pump bodies short','BOM v4 against bin '+SHORT.bin,'p.plan');

  if(S.inspection==='pass')add('done','Updated '+SUP[S.po.sup].short+'’s reject rate','From the incoming inspection','t.rec');

  if(S.wo&&S.wo.status==='done')add('done','Final test passed · tax invoice drafted','INV-2627-0781 waiting for dispatch','a.dispatch');
  if(S.wo&&S.wo.status==='done'&&!S.dispatch)add('ask','Invoice drafted','Dispatch when the truck is loaded','a.dispatch');

      <div class="card ${S.mkt.interest?'ok':'tint'}"><div class="row" style="align-items:flex-start"><span class="logo" style="background:#2a5a86">DA</span><div class="grow"><div class="row sb"><h4>Deccan Agro Equipment</h4>${S.mkt.interest?tp('Interest sent','ok'):tp('New today','acc')}</div><p class="sub">Hubballi · ${idBadge()}</p></div></div>
        <div class="reqbox"><b>40 × 4-inch monoblock pumps</b><span>Needed by 20 Nov · drawings attached · delivery to Hubballi</span></div>
        <div class="split2"><div><h5>Why you were picked</h5><ul class="ticks"><li>You make end-suction pumps</li><li>Passport: ${P.pct}% on time to customers</li><li>${P.ret} returned by customers</li><li>220 km from the buyer</li></ul></div><div><h5>Who else got it</h5><ul class="ticks no"><li>4 other pump makers, 5 in all</li><li>Picked from 212 who make pumps</li><li>Never resold after today</li><li>No fee for the lead</li></ul></div></div>
        ${S.mkt.interest?`<div class="thread" style="margin:0;border-radius:12px;min-height:0"><div class="bub me" style="max-width:100%"><div class="from">Kaveri Pumps via XELOR Market</div>We can make 40 pumps by 14 Nov. Our record is attached. Happy to talk on a call.<div class="t">${stamp()} · passport attached</div></div></div><p class="note">They opened your passport. Numbers swap once both sides tap “Share contact”.</p>`:`<div class="btns"><button class="btn pri" data-a="interest">${I('send')}Send interest with our passport</button><button class="btn gh" data-a="toast" data-msg="Marked as not for you" data-sub="The buyer’s slot goes to the next matched seller." data-tone="info">Not for us</button></div>`}</div>
      <div class="card"><div class="row sb"><h4>Ask the market yourself</h4>${S.mkt.myReq?tp('Sent to 5','ok'):''}</div>
        <div class="reqbox"><b>Powder coating · 80 pump casings</b><span>RAL 5015 blue · 60–80 micron · pickup from Peenya · by 30 Oct</span></div>
        ${S.mkt.myReq?`<div class="list">${[['nandi','Replied · ₹38 a piece · can start 14 Oct'],['shree','Seen'],['maruthi','Seen']].map(([id,t])=>`<div class="li">${mlogo(id)}<div class="grow"><div class="t">${esc(MK[id].name)}</div><div class="m">${t}</div></div>${recBadge(id)}</div>`).join('')}</div>`:`<button class="btn pri sm" data-a="myReq" style="align-self:flex-start">${I('send')}Send to 5 matched sellers</button>`}</div></div>
    <div style="display:flex;flex-direction:column;gap:12px;min-width:0"><div class="card"><h4>Contacts this week</h4>${S.mkt.contacts.length?`<div class="list">${S.mkt.contacts.slice(0,6).map(c=>`<div class="li"><span class="av b">${I(c.ch==='call'?'phone':'msg')}</span><div class="grow"><div class="t">${esc(c.who)}</div><div class="m">${stamp(c.at)} · ${esc(c.what||'masked number')}</div></div></div>`).join('')}</div>`:`<p class="sub">Calls and WhatsApp chats you start from the market appear here. Each one is logged; none of them costs a lead fee.</p>`}</div>
      <div class="card"><h4>How XELOR Market stays clean</h4><ul class="ticks"><li>Buyers are GST and Udyam checked</li><li>Five sellers per request, never resold</li><li>Masked numbers, shared only with consent</li><li>Payment happens between you. XELOR never holds it.</li></ul></div></div></div>`}});

      ${c?'':`<div class="btns" style="flex:0 0 auto"><button class="btn pri sm" data-a="call-pro" data-id="${p.id}">${I('phone')}Call</button><button class="btn gh sm" data-a="contact" data-id="${p.id}" data-ch="whatsapp">${I('msg')}</button></div>`}</div>`}).join('')}</div>`:''}
    <div class="hgrid">${HELP.map(h=>`<button class="htile ${cur.k===h.k?'on':''}" data-a="hcat" data-id="${h.k}"><span class="hi">${I(h.ic)}</span><b>${esc(h.t)}</b><small>${esc(h.d)}</small><em>${h.n} near Peenya</em></button>`).join('')}</div>

      <p class="note">No pay-per-lead and no paid ranking: providers are ordered by distance and confirmed jobs. Provider names are demonstration data.</p></div>`}});

/* ---------- factory profile ---------- */

    const visRow=(k,l,s)=>`<div class="vrow"><div class="grow"><b>${l}</b><small>${s}</small></div><div class="seg">${[['public','Public'],['buyers','Buyers'],['private','Private']].map(([v,t])=>`<button data-a="vis" data-k="${k}" data-v="${v}" aria-pressed="${V[k]===v}">${t}</button>`).join('')}</div></div>`;
    return `<div class="prof"><span class="gring big"><span class="logo" style="background:#7a2945">KP</span></span><div class="grow"><div class="row" style="flex-wrap:wrap"><h3>${esc(FACTORY.name)}</h3><span class="vt">${I('check')}</span>${idBadge()}</div><p class="sub">Pump maker · Peenya, Bengaluru · Udyam Small · end-suction and monoblock pumps</p>
      <div class="pstats"><div><b>${6+(S.mkt.kpost?1:0)}</b><small>posts</small></div><div><b>1,284</b><small>followers</small></div><div><b>${P.pct}%</b><small>on time to customers</small></div><div><b>${9+Object.keys(S.mkt.rfqPost).length}</b><small>requests from posts</small></div></div>

    ${S.closed&&!S.mkt.kpost?`<div class="card gold"><div class="row sb"><div class="row"><span class="agmark">${I('spark')}</span><div><b style="color:var(--ink);display:block">Your agent drafted a post</b><small class="sub" style="display:block">From dispatch ${S.dispatch?S.dispatch.dn:''} · customer name hidden</small></div></div><button class="btn pri sm" data-a="kpost">${I('check')}Approve and post</button></div><p class="sub">“80 pumps shipped to a customer in Andhra Pradesh, 8 days early. Every one passed head, flow, hydro and vibration tests.”</p></div>`:''}
    <div class="two"><div class="pgrid">${(S.mkt.kpost?['pump',...tiles]:tiles).slice(0,6).map((k,i)=>`<div class="ptile">${art(k)}${i===0&&S.mkt.kpost?'<span class="newtag">New</span>':''}</div>`).join('')}</div>

/* ---------- the agent knows about the market ---------- */
{const a0=agentItems;agentItems=function(){const L=a0();
