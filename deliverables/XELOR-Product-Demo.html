*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--body);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5{font-family:var(--display);color:var(--ink);margin:0;letter-spacing:-.015em;text-wrap:balance;line-height:1.15}
p{margin:0} ul,ol{margin:0;padding:0;list-style:none} button{font:inherit;color:inherit} input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.kn{font-family:var(--kn)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
svg.ic{width:1em;height:1em;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}

/* ---------- page shell ---------- */
.shell{padding-inline:clamp(16px,2.4vw,32px);padding-block:0 56px;max-width:1560px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px) saturate(1.2);border-bottom:1px solid var(--line)}
.top-in{max-width:1560px;margin:0 auto;padding:10px clamp(16px,2.4vw,32px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mk{width:34px;height:34px;border-radius:10px;background:var(--deep);color:var(--gold);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 40%,transparent)}
.brand b{font-family:var(--display);font-weight:800;font-size:18px;color:var(--ink)} .brand b span{color:var(--green-ink)}
.brand small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);font-weight:700}
.modes{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;margin-left:auto}
.modes button{border:0;background:transparent;padding:7px 15px;border-radius:999px;font-weight:700;font-size:13px;color:var(--body);cursor:pointer;display:flex;gap:7px;align-items:center;transition:background .2s,color .2s}
.modes button[aria-pressed="true"]{background:var(--deep);color:var(--on-deep)}
.vchip{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink);border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);background:var(--gold-soft);border-radius:999px;padding:5px 10px;font-weight:700}

/* ---------- tour strip ---------- */
.tour{margin-top:16px;background:var(--deep);color:var(--on-deep);border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.tour::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 140% at 100% 0%,color-mix(in srgb,var(--gold) 26%,transparent),transparent 60%);pointer-events:none}
.tour > *{position:relative}
.tnum{width:58px;height:58px;border-radius:16px;border:1.5px solid color-mix(in srgb,var(--gold) 70%,transparent);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px;color:#f0c95f;font-variant-numeric:tabular-nums}
.tnum small{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--deep-sub);font-weight:500;margin-top:-4px}
.ttxt{min-width:0}
.ttxt .kick{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#f0c95f;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ttxt .kick .rtag{color:var(--deep);background:#f0c95f;border-radius:4px;padding:1px 6px}
.ttxt h2{color:#fbf6e8;font-size:clamp(17px,1.6vw,21px);margin-top:4px}
.ttxt p{color:var(--deep-sub);font-size:13.5px;margin-top:3px;max-width:92ch}
.tbar{display:flex;gap:3px;margin-top:10px}
.tbar button{flex:1;height:6px;border:0;border-radius:4px;background:rgba(255,255,255,.14);cursor:pointer;padding:0;position:relative;transition:background .3s,transform .2s}
.tbar button:hover{transform:scaleY(1.6)}
.tbar button.done{background:color-mix(in srgb,#f0c95f 60%,transparent)}
.tbar button.cur{background:#f0c95f;box-shadow:0 0 0 3px rgba(240,201,95,.22)}
.tctl{display:flex;gap:8px;align-items:center}
.tbtn{border:1px solid rgba(255,255,255,.22);background:transparent;color:#fbf6e8;border-radius:999px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.08)}
.tbtn.go{background:#f0c95f;color:#1d1606;border-color:#f0c95f}
.tbtn.go:hover{filter:brightness(1.06);background:#f0c95f}
.tbtn:disabled{opacity:.35;cursor:default}
@media (max-width:820px){.tour{grid-template-columns:auto minmax(0,1fr)}.tctl{grid-column:1/-1}.tctl .tbtn{flex:1;justify-content:center}}

/* ---------- role rail ---------- */
.rail{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.roles{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.rbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 12px 7px 8px;display:flex;align-items:center;gap:9px;cursor:pointer;transition:transform .18s var(--ease),border-color .2s,box-shadow .2s;text-align:left;position:relative}
.rbtn:hover{transform:translateY(-1px);border-color:var(--line-2)}
.rbtn .ri{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--role-soft);color:var(--role-ink);font-size:16px}
.rbtn b{display:block;font-size:13px;color:var(--ink);line-height:1.1}
.rbtn small{display:block;font-size:10.5px;color:var(--muted);line-height:1.2}
.rbtn[aria-pressed="true"]{border-color:var(--role);box-shadow:0 0 0 3px color-mix(in srgb,var(--role) 22%,transparent)}
.rbtn[aria-pressed="true"] .ri{background:var(--role);color:var(--on-role)}
.rbtn .new{position:absolute;top:-7px;right:-6px;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.08em;background:var(--gold);color:var(--on-gold);border-radius:4px;padding:2px 5px}
.rbtn .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--surface);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.devs{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.devs button{border:0;background:transparent;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;color:var(--body);display:flex;align-items:center;gap:5px}
.devs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.resetb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;color:var(--body);display:flex;align-items:center;gap:6px}

/* role colour contexts */
/* ---------- stage ---------- */
.stagegrid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-top:16px;align-items:start}
@media (min-width:1240px){.stagegrid{grid-template-columns:minmax(0,1fr) 350px}}
.stage{display:flex;justify-content:center;min-width:0}
.frame{background:var(--bezel);padding:10px;box-shadow:var(--shadow-lg);position:relative;width:min(392px,100%);border-radius:40px;transition:width .45s var(--ease),border-radius .45s var(--ease)}
.frame.tablet{width:min(880px,100%);border-radius:26px}
.frame.laptop{width:100%;border-radius:16px}
.frame .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:24px;background:var(--bezel);border-radius:0 0 14px 14px;z-index:6}
.frame.tablet .notch,.frame.laptop .notch{display:none}
.chrome{display:none;align-items:center;gap:10px;padding:6px 8px 10px}
.frame.tablet .chrome,.frame.laptop .chrome{display:flex}
.chrome .dots{display:flex;gap:6px}.chrome .dots i{width:10px;height:10px;border-radius:50%;background:var(--bezel-2);display:block}
.chrome .addr{flex:1;background:var(--bezel-2);border-radius:8px;padding:5px 12px;font-family:var(--mono);font-size:11px;color:var(--bezel-txt);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;justify-content:center;gap:6px}
.vp{position:relative;border-radius:31px;overflow:hidden;background:var(--surface-2);height:clamp(560px,calc(100vh - 250px),800px);container-type:inline-size;container-name:vp}
.frame.tablet .vp,.frame.laptop .vp{border-radius:10px;height:clamp(560px,calc(100vh - 260px),780px)}
.statusbar{height:36px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 5px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--on-bar);background:var(--bar);flex:0 0 auto}
.r-floor .statusbar{background:var(--teal);color:var(--on-teal)}
.frame.tablet .statusbar,.frame.laptop .statusbar{display:none}

/* ---------- spec panel ---------- */
.spec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;min-width:0}
.spec .sh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.spec .sh .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);font-weight:700;display:flex;gap:6px;align-items:center}
.spec h3{font-size:18px}
.spec .route{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;word-break:break-all}
.spec .purpose{font-size:13.5px;color:var(--body)}
.spec h5{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.spec li{font-size:12.5px;color:var(--body);padding:4px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px;justify-content:space-between;align-items:baseline}
.spec li:last-child{border-bottom:0}
.spec li code{font-family:var(--mono);font-size:10.5px;color:var(--green-ink);text-align:right;word-break:break-word;min-width:0}
.spec .rules li{justify-content:flex-start}
.spec .rules li::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--gold);flex:0 0 auto;margin-top:6px}
.spec .chips{display:flex;flex-wrap:wrap;gap:5px}
.spec .open{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 12px;font-weight:700;font-size:12.5px;cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center;color:var(--ink)}

/* ---------- shared UI atoms (inside device) ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:9px;min-width:0}
.card.tint{background:var(--role-soft);border-color:color-mix(in srgb,var(--role) 45%,transparent)}
.card.gold{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
.card.warn{background:var(--ochre-soft);border-color:color-mix(in srgb,var(--ochre) 50%,transparent)}
.card.ok{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.card h4{font-size:15px} .card .sub,.sub{font-size:12.5px;color:var(--muted)}
.eyb{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--role-ink);font-weight:700}
.big{font-family:var(--display);font-weight:800;font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.05}
.big small{font-size:12px;color:var(--muted);font-weight:600}
.h3{font-size:19px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.sb{justify-content:space-between}
.grow{flex:1;min-width:0}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.kv:last-child{border-bottom:0} .kv b{color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .12s var(--ease),filter .15s,background .2s;text-align:center;line-height:1.2}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--role);color:var(--on-role)} .btn.pri:hover{filter:brightness(1.06)}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.gh{background:transparent;border:1.5px solid var(--line-2);color:var(--ink)} .btn.gh:hover{border-color:var(--role)}
.btn.dn{background:var(--red);color:var(--on-red)}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn.xs{padding:5px 9px;font-size:11.5px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btns{display:flex;gap:8px;flex-wrap:wrap} .btns .btn{flex:1}
.pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent;display:inline-flex;align-items:center;gap:4px}
.st-requested{background:var(--gold-soft);color:var(--gold-ink);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.st-accepted{background:var(--blue-soft);color:var(--blue);border-color:color-mix(in srgb,var(--blue) 45%,transparent)}
.st-delivered{background:var(--teal-soft);color:var(--teal);border-color:color-mix(in srgb,var(--teal) 45%,transparent)}
.st-confirmed,.st-approved,.st-ok,.st-go,.st-granted{background:var(--green-soft);color:var(--green-ink);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.st-declined,.st-expired,.st-cancelled,.st-lapsed,.st-off{background:var(--surface-3);color:var(--muted);border-color:var(--line-2)}
.st-disputed,.st-reject,.st-rejected,.st-low{background:var(--red-soft);color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
.st-awaiting,.st-review,.st-pending{background:var(--ochre-soft);color:var(--ochre);border-color:color-mix(in srgb,var(--ochre) 45%,transparent)}
.tier{font-family:var(--mono);font-size:9px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap}
.tier.t0{background:var(--deep);color:var(--on-deep)}
.tier.t1{background:var(--green);color:var(--on-green)}
.tier.t2{background:var(--green-soft);color:var(--green-ink);border:1px solid color-mix(in srgb,var(--green) 45%,transparent)}
.tier.t3{background:var(--ochre-soft);color:var(--ochre);border:1px solid color-mix(in srgb,var(--ochre) 45%,transparent)}
.tier.t4{background:var(--surface-3);color:var(--muted);border:1px dashed var(--line-2);text-decoration:line-through}
.badge{font-family:var(--mono);font-size:9px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;color:var(--green-ink);border:1px solid color-mix(in srgb,var(--green) 45%,transparent);border-radius:4px;padding:1px 5px;white-space:nowrap}
.badge.g{color:var(--gold-ink);border-color:color-mix(in srgb,var(--gold) 60%,transparent);background:var(--gold-soft)}
.badge.b{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 45%,transparent)}
.badge.o{color:var(--ochre);border-color:color-mix(in srgb,var(--ochre) 45%,transparent)}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.note.rule{border-left:2.5px solid var(--gold);padding-left:10px;color:var(--body)}
.field{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:14px;transition:border-color .2s}
.field:focus{border-color:var(--role);outline:none}
label.fl{font-size:12px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;gap:8px}
label.fl .kn{font-weight:500;color:var(--muted)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-size:12.5px;font-weight:700;color:var(--body);cursor:pointer;transition:background .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--role-ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:var(--surface-2);width:34px;height:34px;font-size:17px;font-weight:700;cursor:pointer;color:var(--ink)}
.stepper span{min-width:64px;text-align:center;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;font-size:13.5px}
.tg{width:44px;height:26px;border-radius:999px;background:var(--line-2);position:relative;flex:0 0 auto;transition:background .25s;border:0;cursor:pointer;padding:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .3s var(--spring)}
.tg[aria-pressed="true"]{background:var(--role)} .tg[aria-pressed="true"]::after{left:21px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--role);background:var(--role-soft);color:var(--role-ink)}
.empty{border:1.5px dashed var(--line-2);border-radius:14px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.empty .ei{width:42px;height:42px;border-radius:12px;background:var(--role-soft);color:var(--role-ink);display:grid;place-items:center;font-size:21px}
.empty b{color:var(--ink);font-size:14px}
.av{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px;flex:0 0 auto;background:var(--role-soft);color:var(--role-ink)}
.av.f{background:var(--green-soft);color:var(--green-ink)} .av.d{background:var(--gold-soft);color:var(--gold-ink)} .av.b{background:var(--blue-soft);color:var(--blue)} .av.k{background:var(--ochre-soft);color:var(--ochre)}
.ph{width:54px;height:54px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;font-size:22px;color:rgba(255,255,255,.92)}
.ph.tom{background:linear-gradient(140deg,#8e2f1f,#d0643c)} .ph.oni{background:linear-gradient(140deg,#6d3a57,#b8718f)} .ph.inp{background:linear-gradient(140deg,#1b4d38,#3f8f67)} .ph.mch{background:linear-gradient(140deg,#4b3a16,#a8842f)} .ph.crt{background:linear-gradient(140deg,#243a55,#5a7fa8)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:11px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px 11px;min-width:0;transition:transform .18s var(--ease),box-shadow .2s,border-color .2s}
.li.hover:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-2);cursor:pointer}
.li .t{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.25}
.li .m{font-size:11.5px;color:var(--muted);line-height:1.35}
.li .p{font-family:var(--display);font-weight:800;font-size:15px;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.li .p small{font-size:10.5px;color:var(--muted);font-weight:600;font-family:var(--sans)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1.5px solid var(--line);font-weight:700;white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--body)}
.tbl td b{color:var(--ink)} .tbl tr:last-child td{border-bottom:0}
.tbl tr.flash td{animation:rowflash 1.4s ease}
@keyframes rowflash{0%{background:var(--gold-soft)}100%{background:transparent}}
.scx{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:var(--surface);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--display);font-size:22px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:11.5px;color:var(--muted)}
.kpi.hl{background:var(--role-soft);border-color:color-mix(in srgb,var(--role) 45%,transparent)}
.kpi.hl b{color:var(--role-ink)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:12.5px}
.bar .tr{height:9px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:5px;background:var(--role);transform-origin:left;animation:grow .9s var(--ease) both}
.bar b{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
@keyframes grow{from{transform:scaleX(0)}}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative;margin:4px 0 2px}
.tl .s{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;text-align:center}
.tl .s::before{content:"";position:absolute;top:10px;left:-50%;right:50%;height:2.5px;background:var(--line)}
.tl .s:first-child::before{display:none}
.tl .s.on::before{background:var(--green);animation:grow .6s var(--ease) both}
.tl .d{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line-2);background:var(--surface);z-index:1;display:grid;place-items:center;font-size:11px;color:transparent;transition:all .35s var(--spring)}
.tl .s.on .d{background:var(--green);border-color:var(--green);color:var(--on-green)}
.tl .s.cur .d{box-shadow:0 0 0 5px color-mix(in srgb,var(--green) 22%,transparent)}
.tl .n{font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tl .s.on .n{color:var(--green-ink)}
.tl .w{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:14px}

/* ---------- FARMER / OFFICER phone app ---------- */
.app{display:flex;flex-direction:column;height:100%;background:var(--surface-2)}
.abar{background:var(--bar);color:var(--on-bar);padding:10px 14px 12px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.r-floor .abar{background:var(--teal);color:var(--on-teal)}
.abar .bk{width:32px;height:32px;border-radius:10px;border:0;background:rgba(255,255,255,.16);color:inherit;display:grid;place-items:center;cursor:pointer;font-size:17px}
.abar .tt{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.1;min-width:0}
.abar .tt small{display:block;font-family:var(--kn);font-weight:500;font-size:11px;opacity:.8}
.abar .rt{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11.5px}
.abar .loc{display:flex;align-items:center;gap:5px;opacity:.9}
.abar .bell{position:relative;width:32px;height:32px;border-radius:10px;border:0;background:rgba(255,255,255,.16);color:inherit;display:grid;place-items:center;cursor:pointer;font-size:16px}
.abar .bell i{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:var(--gold);color:var(--on-gold);font-style:normal;font-size:9.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;font-family:var(--mono)}
.abody{flex:1;overflow-y:auto;padding:14px;scrollbar-width:thin;min-height:0}
.abody > .scr,.pmain > .scr{display:flex;flex-direction:column;gap:12px}
.anav{display:flex;background:var(--surface);border-top:1px solid var(--line);flex:0 0 auto;padding-bottom:6px}
.anav button{flex:1;border:0;background:transparent;padding:9px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:10.5px;font-weight:700;position:relative}
.anav button .ic{font-size:19px}
.anav button small{font-family:var(--kn);font-size:9px;font-weight:500}
.anav button[aria-current="page"]{color:var(--role-ink)}
.anav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--role)}
.anav button .cnt{position:absolute;top:4px;left:calc(50% + 6px);min-width:15px;height:15px;border-radius:8px;background:var(--gold);color:var(--on-gold);font-size:9px;display:grid;place-items:center;padding:0 3px;font-family:var(--mono)}
.hero{background:linear-gradient(135deg,var(--deep),color-mix(in srgb,var(--deep) 70%,var(--green)));border-radius:16px;padding:16px;color:var(--on-deep);display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:22px solid color-mix(in srgb,#f0c95f 22%,transparent)}
.hero h4{color:#fbf6e8;font-size:18px;position:relative} .hero p{color:var(--deep-sub);font-size:12.5px;position:relative}
.hero .eyb{color:#f0c95f}
.search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:10px 14px;font-size:13px;color:var(--muted)}
.search .r{margin-left:auto;font-size:11px;font-weight:700;color:var(--role-ink);white-space:nowrap}
.secs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:transform .18s var(--spring),border-color .2s,background .2s}
.sec:hover,.sec[aria-pressed="true"]{transform:translateY(-2px);border-color:var(--role);background:var(--role-soft)}
.sec .ic{font-size:20px;color:var(--role-ink)} .sec span{font-size:10px;color:var(--body);text-align:center;line-height:1.15;font-weight:600}
.act{display:flex;gap:10px;align-items:center;padding:11px;border-radius:13px;background:var(--surface);border:1px solid var(--line);cursor:pointer;min-width:0;transition:transform .15s}
.act:hover{transform:translateX(2px)}
.act .ai{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.act .ai.g{background:var(--gold-soft);color:var(--gold-ink)} .act .ai.o{background:var(--ochre-soft);color:var(--ochre)} .act .ai.b{background:var(--blue-soft);color:var(--blue)}
.fact{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px dashed var(--line)}
.fact:last-child{border-bottom:0}
.fact .fi{width:30px;height:30px;border-radius:9px;background:var(--green-soft);color:var(--green-ink);display:grid;place-items:center;font-size:15px}
.fact .fn{font-size:13px;font-weight:700;color:var(--ink);line-height:1.3} .fact .fs{font-size:10.5px;color:var(--muted);font-family:var(--mono);margin-top:1px}
.fact.new{animation:factin 1.2s var(--ease)}
@keyframes factin{0%{background:var(--gold-soft);transform:translateX(-6px)}100%{background:transparent;transform:none}}
.nodes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.node{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);display:flex;flex-direction:column;gap:1px;cursor:pointer}
.node b{font-size:12px;color:var(--ink)} .node span{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.node.on{border-color:color-mix(in srgb,var(--green) 55%,transparent);background:var(--green-soft)}
.node.on span{color:var(--green-ink)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.lv{text-align:center;border-radius:8px;padding:7px 2px;border:1.5px solid var(--line);font-family:var(--mono);font-size:9.5px;color:var(--muted);font-weight:700;transition:all .4s var(--spring)}
.lv.on{background:var(--green);border-color:var(--green);color:var(--on-green)}
.lv.pop{animation:lvpop .8s var(--spring)}
@keyframes lvpop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.pipe{display:flex;flex-direction:column}
.ps{display:grid;grid-template-columns:26px 1fr;gap:11px;position:relative;padding-bottom:14px}
.ps::before{content:"";position:absolute;left:12px;top:26px;bottom:0;width:2px;background:var(--line)}
.ps:last-child::before{display:none}
.ps .pd{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--muted);z-index:1;font-family:var(--mono)}
.ps.done .pd{background:var(--green);border-color:var(--green);color:var(--on-green)} .ps.done::before{background:var(--green)}
.ps.now .pd{border-color:var(--gold);color:var(--gold-ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 25%,transparent)}
.ps .pt{font-size:13.5px;font-weight:700;color:var(--ink)} .ps .pp{font-size:11.5px;color:var(--muted)}
.otp{display:flex;gap:8px;justify-content:center}
.otp span{width:44px;height:52px;border-radius:12px;border:2px solid var(--line-2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:var(--ink);background:var(--surface)}
.otp span.f{border-color:var(--role);animation:lvpop .45s var(--spring) both}
.wave{display:flex;align-items:center;gap:2px;height:26px;flex:1}
.wave i{flex:1;background:color-mix(in srgb,#f0c95f 70%,transparent);border-radius:2px;height:30%}
.wave.play i{animation:wv 1s ease-in-out infinite}
@keyframes wv{0%,100%{height:25%}50%{height:95%}}
.decision{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;border:1.5px solid}
.decision.go{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 50%,transparent)}
.decision.review{background:var(--ochre-soft);border-color:color-mix(in srgb,var(--ochre) 50%,transparent)}
.decision.reject{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 50%,transparent)}
.decision .dv{font-family:var(--display);font-weight:800;font-size:36px;line-height:1}
.decision.go .dv{color:var(--green-ink)} .decision.review .dv{color:var(--ochre)} .decision.reject .dv{color:var(--red)}
.reasons li{font-size:12.5px;display:grid;grid-template-columns:auto 1fr;gap:8px;padding:4px 0;color:var(--body);align-items:baseline}
.reasons li code{font-family:var(--mono);font-size:9.5px;color:var(--muted);font-weight:700}
.tick{width:60px;height:60px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;font-size:28px;margin:6px auto 0;animation:lvpop .7s var(--spring)}
.center{text-align:center}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shot{aspect-ratio:4/3;max-width:100%;border-radius:12px;border:2px dashed var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;color:var(--muted);cursor:pointer;background:var(--surface);text-align:center;padding:6px;position:relative;overflow:hidden;transition:border-color .2s}
.shot .ic{font-size:20px;color:var(--teal)}
.shot.done{border:0;color:#fff;background:linear-gradient(150deg,#27543f,#6c9a52 60%,#b9a35a);animation:lvpop .5s var(--spring)}
.shot.done .ic{color:#fff}
.shot.done small{position:absolute;left:6px;bottom:5px;font-family:var(--mono);font-size:8.5px;background:rgba(0,0,0,.45);padding:2px 5px;border-radius:4px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check .cb{width:22px;height:22px;border-radius:7px;border:2px solid var(--line-2);display:grid;place-items:center;flex:0 0 auto;color:transparent;transition:all .25s var(--spring)}
.check[aria-checked="true"] .cb{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.check b{font-size:13px;color:var(--ink);display:block} .check span{font-size:11.5px;color:var(--muted)}
.gps{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--teal-soft);border:1px solid color-mix(in srgb,var(--teal) 40%,transparent)}
.gps .gi{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:var(--on-teal);font-size:19px;position:relative}
.gps .gi.seek::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--teal);animation:ping 1.2s infinite}
@keyframes ping{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.5);opacity:0}}
.offline{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.18)}

/* ---------- PORTAL ---------- */
.portal{display:flex;flex-direction:column;height:100%;background:var(--surface-2)}
.ptop{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex:0 0 auto;min-width:0}
.ptop .pm{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--role);color:var(--on-role);font-family:var(--display);font-weight:800;font-size:13px;flex:0 0 auto}
.ptop b{font-size:14.5px;color:var(--ink);display:block;line-height:1.2} .ptop small{font-size:11.5px;color:var(--muted);display:block}
.ptop .rt{margin-left:auto;display:flex;align-items:center;gap:8px}
.ptop .credits{font-family:var(--mono);font-size:10.5px;font-weight:700;border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);background:var(--gold-soft);color:var(--gold-ink);border-radius:999px;padding:4px 10px;white-space:nowrap}
.pwrap{flex:1;display:flex;min-height:0}
.pside{width:206px;flex:0 0 auto;background:var(--surface);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.pside .sb{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:4px 8px 6px;font-weight:700}
.ptab{text-align:left;background:transparent;border:0;font-size:13px;color:var(--body);padding:9px 10px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:9px;font-weight:600;white-space:nowrap;transition:background .15s}
.ptab .ic{font-size:16px;color:var(--muted)}
.ptab:hover{background:var(--surface-2)}
.ptab[aria-current="page"]{background:var(--role);color:var(--on-role)}
.ptab[aria-current="page"] .ic{color:var(--on-role)}
.ptab .c{margin-left:auto;font-family:var(--mono);font-size:9.5px;font-weight:700;background:var(--gold);color:var(--on-gold);border-radius:999px;padding:1px 7px}
.pside .foot{margin-top:auto;padding:10px 8px 2px;font-size:11px;color:var(--muted);border-top:1px dashed var(--line)}
.pmain{flex:1;overflow-y:auto;padding:18px;min-width:0;scrollbar-width:thin}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.phead h3{font-size:20px} .phead p{font-size:13px;color:var(--muted);margin-top:3px;max-width:70ch}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.board{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--surface-3);border-radius:13px;padding:9px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h5{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;padding:2px 3px;font-weight:700}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;animation:cardin .45s var(--spring)}
.oc .t{font-weight:700;color:var(--ink);font-size:13px;line-height:1.25}
.oc .m{color:var(--muted);font-size:11.5px}
.oc.hl{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
@keyframes cardin{from{opacity:.2;transform:translateY(8px) scale(.98)}}
@container vp (max-width:720px){
  .pwrap{flex-direction:column}
  .pside{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .pside .sb,.pside .foot{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:minmax(0,1fr)}
  .pmain{padding:13px}
  .hide-n{display:none}
}

/* map */
.map{background:var(--map-land);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.map svg{display:block;width:100%;height:auto}
.map .road{stroke:var(--map-road);stroke-width:5;fill:none;stroke-linecap:round}
.map .rad{fill:color-mix(in srgb,var(--blue) 7%,transparent);stroke:var(--blue);stroke-width:1.2;stroke-dasharray:5 5;opacity:.7}
.map .lbl{font-family:var(--sans);font-size:11px;font-weight:700;fill:var(--ink)}
.map .lbl.s{font-size:9.5px;font-weight:600;fill:var(--muted)}
.map .leg{stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.1s var(--ease) forwards}
.map .leg.loop{stroke:var(--gold)} .map .leg.near{stroke:var(--muted);stroke-dasharray:4 5;animation:none;stroke-dashoffset:0;stroke-width:1.8}
.map .tri{fill:color-mix(in srgb,var(--gold) 16%,transparent);opacity:0;animation:fade .8s .9s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.map .pt{transform-box:fill-box;transform-origin:center;animation:ptin .5s var(--spring) both}
@keyframes ptin{from{transform:scale(0)}}
.map .buyer-pulse{fill:none;stroke:var(--blue);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 1.8s infinite}
.mlegend{display:flex;flex-wrap:wrap;gap:12px;padding:8px 12px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);background:var(--surface)}
.mlegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.mlegend i.sq{border-radius:2px}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@container vp (max-width:720px){.res{grid-template-columns:minmax(0,1fr)}}
.resc{border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:5px;min-width:0}
.resc .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.resc .v{font-family:var(--display);font-weight:800;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.resc.best{background:var(--gold-soft);border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 20%,transparent)}
.resc.best .k{color:var(--gold-ink)}

/* chat (WhatsApp handoff) */
.wa{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--wa-bg);min-height:0}
.wa .wh{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.wa .wh b{font-size:13.5px;color:var(--ink);display:block;line-height:1.2} .wa .wh small{font-size:11px;color:var(--muted)}
.wa .wm{padding:12px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;max-height:360px;min-height:180px}
.msg{max-width:82%;padding:7px 10px 5px;border-radius:11px;font-size:13px;color:var(--ink);line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.08);animation:msgin .35s var(--spring) both}
.msg small{display:block;text-align:right;font-size:9.5px;color:var(--muted);margin-top:2px;font-family:var(--mono)}
.msg.in{background:var(--wa-in);align-self:flex-start;border-top-left-radius:3px}
.msg.out{background:var(--wa-out);align-self:flex-end;border-top-right-radius:3px}
.msg.sys{background:var(--wa-sys);align-self:center;text-align:center;font-size:11.5px;max-width:92%;color:var(--body);border-radius:8px}
@keyframes msgin{from{opacity:0;transform:translateY(6px) scale(.97)}}
.wa .wi{display:flex;gap:8px;padding:8px;background:var(--surface);border-top:1px solid var(--line)}
.wa .wi input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:8px 13px;background:var(--surface-2);min-width:0}
.wa .wi button{width:38px;height:38px;border-radius:50%;border:0;background:var(--green);color:var(--on-green);display:grid;place-items:center;cursor:pointer;font-size:16px;flex:0 0 auto}
.threads{display:grid;grid-template-columns:240px minmax(0,1fr);gap:12px;align-items:start}
@container vp (max-width:720px){.threads{grid-template-columns:minmax(0,1fr)}}
.thr{display:flex;flex-direction:column;gap:6px}
.thr button{display:flex;gap:9px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px;cursor:pointer;min-width:0}
.thr button[aria-current="true"]{border-color:var(--role);background:var(--role-soft)}
.thr button b{font-size:12.5px;color:var(--ink);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thr button small{font-size:11px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* screen entrance */
.enter{animation:scrin .38s var(--ease) both}
@keyframes scrin{from{opacity:0;transform:translateY(10px)}}
.stg > *{animation:scrin .45s var(--ease) both}
.stg > *:nth-child(2){animation-delay:.04s}.stg > *:nth-child(3){animation-delay:.08s}.stg > *:nth-child(4){animation-delay:.12s}.stg > *:nth-child(5){animation-delay:.16s}.stg > *:nth-child(6){animation-delay:.2s}.stg > *:nth-child(n+7){animation-delay:.24s}

/* toast */
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,calc(100vw - 32px))}
.toast{background:var(--deep);color:var(--on-deep);font-size:13px;padding:11px 16px 11px 12px;border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center;animation:tin .45s var(--spring) both;position:relative;overflow:hidden;max-width:100%}
.toast .ti{width:26px;height:26px;border-radius:8px;background:#f0c95f;color:#1d1606;display:grid;place-items:center;flex:0 0 auto;font-size:14px}
.toast::after{content:"";position:absolute;left:0;bottom:0;height:2.5px;background:#f0c95f;animation:tbar 3.4s linear forwards}
.toast.out{animation:tout .35s ease forwards}
@keyframes tin{from{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateY(10px)}}
@keyframes tbar{from{width:100%}to{width:0}}

/* ---------- BUILD SPEC doc ---------- */
.doc{margin-top:22px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:980px){.doc{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
.toc{position:sticky;top:84px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.toc a{color:var(--body);text-decoration:none;padding:6px 10px;border-radius:8px;border-left:2px solid transparent}
.toc a:hover{background:var(--surface);border-left-color:var(--gold)}
.toc .tl-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);font-weight:700;padding:0 10px 8px}
.dsec{padding:26px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:14px;min-width:0;scroll-margin-top:80px}
.dsec:first-child{padding-top:4px}
.dsec .ey{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);font-weight:700;display:flex;align-items:center;gap:10px}
.dsec .ey::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 60%,transparent),transparent)}
.dsec h2{font-size:clamp(22px,2.4vw,30px)}
.dsec > p{max-width:78ch;font-size:15px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;display:flex;flex-direction:column;gap:8px;min-width:0}
.dcard h4{font-size:15.5px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.dcard p,.dcard li{font-size:13px}
.dcard .fields li{font-family:var(--mono);font-size:11.5px;padding:3px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:10px;color:var(--ink)}
.dcard .fields li span{color:var(--muted);font-family:var(--sans);font-size:11.5px;text-align:right}
.dcard .fields li:last-child{border-bottom:0}
.sm-chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sm-chain .st{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:5px 9px;border-radius:7px;background:var(--surface-2);border:1.5px solid var(--line-2);color:var(--ink)}
.sm-chain .st.a{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink)}
.sm-chain .st.e{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 55%,transparent);color:var(--green-ink)}
.sm-chain .st.x{background:var(--surface-3);border-style:dashed;color:var(--muted)}
.sm-chain .ar{color:var(--muted);font-size:13px}
.sm-note{font-size:12.5px;color:var(--muted)}
.dtable{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface)}
.dtable th{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink);text-align:left;padding:10px 12px;border-bottom:2px solid color-mix(in srgb,var(--gold) 55%,transparent);white-space:nowrap;font-weight:700;background:var(--surface)}
.dtable td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--body)}
.dtable td b{color:var(--ink)} .dtable code{font-family:var(--mono);font-size:11.5px;color:var(--green-ink)}
.dtable tr.click{cursor:pointer} .dtable tr.click:hover td{background:var(--gold-soft)}
.method{font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
.method.post{background:var(--green-soft);color:var(--green-ink)} .method.patch{background:var(--gold-soft);color:var(--gold-ink)} .method.del{background:var(--red-soft);color:var(--red)}
.sw{display:flex;flex-direction:column;gap:6px}
.sw i{display:block;height:54px;border-radius:10px;border:1px solid var(--line)}
.sw b{font-size:12.5px;color:var(--ink)} .sw code{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.swgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.typescale{display:flex;flex-direction:column;gap:10px}
.typescale div{display:flex;align-items:baseline;gap:16px;border-bottom:1px dashed var(--line);padding-bottom:8px;min-width:0;flex-wrap:wrap}
.typescale code{font-family:var(--mono);font-size:10.5px;color:var(--muted);width:150px;flex:0 0 auto}
.gallery{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.changes li{padding:8px 0 8px 22px;position:relative;font-size:14px;border-bottom:1px dashed var(--line)}
.changes li::before{content:"";position:absolute;left:4px;top:15px;width:8px;height:8px;border-radius:2px;background:var(--gold);transform:rotate(45deg)}
.changes li b{color:var(--ink)}
.callout{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:14px;padding:14px 16px;font-size:13.5px;color:var(--body)}
.callout b{color:var(--ink)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}.map .leg{stroke-dashoffset:0!important}.map .tri{opacity:1!important}}
/* ---------- XELOR Floor app + Accounts console ---------- */
.r-floor .statusbar,.r-floor .abar{background:var(--deep);color:var(--on-deep)}
.r-floor .abar .tt{color:#f0c95f}
.r-floor{--role:var(--deep);--on-role:#f0c95f;--role-ink:var(--gold-ink);--role-soft:var(--gold-soft)}
:root[data-theme="dark"] .r-floor,:root:not([data-theme="light"]) .r-floor{--role:var(--deep)}
.btn.xp{background:var(--deep);color:#f0c95f;box-shadow:inset 0 0 0 1px color-mix(in srgb,#f0c95f 35%,transparent)}
.btn.xp:disabled{opacity:.4}
.xp-strip{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--gold-ink);background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);border-radius:10px;padding:7px 11px}
.xp-task{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:11px 12px;font-size:12.5px;color:var(--body);cursor:pointer;width:100%}
.xp-task b{color:var(--ink);font-size:13.5px}.xp-task .mono{font-size:10.5px;color:var(--muted)}
.xp-task.done{border-left-color:var(--green);cursor:default}
.sla{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ochre);display:inline-flex;gap:4px;align-items:center}
.xp-farmer{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.xp-farmer b{display:block;color:var(--ink);font-size:13.5px}.xp-farmer span{font-size:11.5px;color:var(--muted)}
.xp-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.xp-steps button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9.5px;font-weight:700;color:var(--muted);cursor:pointer;padding:0;position:relative}
.xp-steps button span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);background:var(--surface);font-size:14px;transition:all .3s var(--spring)}
.xp-steps button.cur{color:var(--ink)} .xp-steps button.cur span{border-color:#c89a2e;background:var(--deep);color:#f0c95f;transform:scale(1.08)}
.xp-steps button.ok span{background:var(--green);border-color:var(--green);color:var(--on-green)}
.xp-steps button:disabled{cursor:not-allowed;opacity:.5}
.xp-map{border-radius:10px;overflow:hidden;border:1px solid var(--line)} .xp-map svg{display:block;width:100%;height:auto}
.gl{font-family:var(--mono);font-size:10px;font-weight:700;fill:var(--ink)} .gl.s{fill:var(--muted);font-weight:500}
.odot{animation:ptin .5s var(--spring) both;transform-box:fill-box;transform-origin:center}
.xp-face{width:130px;height:130px;margin:4px auto;color:var(--muted);display:grid;place-items:center}
.xp-face svg{width:100%;height:100%}
.xp-face.run{color:#c89a2e} .xp-face.run svg{animation:spin 2.4s linear infinite}
.xp-face.ok{color:var(--green)}
@keyframes spin{to{transform:rotate(360deg)}}
.xpshot{padding:0;border-style:solid}
.xpshot > svg{position:absolute;inset:0;width:100%;height:100%}
.xpshot .lbl2 svg.ic{position:static;width:1em;height:1em;font-size:12px;color:inherit}
.xpshot .lbl2{position:relative;z-index:1;font-size:11px;font-weight:700;display:flex;gap:4px;align-items:center;padding:4px 8px;border-radius:6px}
.xpshot.done .lbl2{position:absolute;top:6px;left:6px;background:rgba(10,20,15,.7);color:#fbf6e8;font-size:9.5px}
.xpshot .frameguide{position:absolute;inset:14px;border:2px dashed color-mix(in srgb,#c89a2e 70%,transparent);border-radius:8px}
.xpshot.done small{z-index:1}
/* lender console */
.r-acct .portal{background:var(--surface-2)}
.r-acct .ptop{background:var(--deep);border-bottom-color:transparent}
.r-acct .ptop b{color:#fbf6e8} .r-acct .ptop small{color:var(--deep-sub)}
.r-acct .ptop .pm{background:#c89a2e;color:#1d1606}
.r-acct .pside{background:var(--deep);border-right-color:transparent}
.r-acct .pside .sb{color:#f0c95f}
.r-acct .ptab{color:var(--deep-sub)} .r-acct .ptab .ic{color:var(--deep-sub)}
.r-acct .ptab:hover{background:rgba(255,255,255,.06)}
.r-acct .ptab[aria-current="page"]{background:rgba(240,201,95,.14);color:#f0c95f;box-shadow:inset 3px 0 0 #f0c95f}
.r-acct .ptab[aria-current="page"] .ic{color:#f0c95f}
.r-acct .pside .foot{color:var(--deep-sub);border-top-color:rgba(255,255,255,.1)}
.xp-shadow{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink);background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:999px;padding:5px 10px;display:inline-flex;gap:5px;align-items:center}
.xp-tbl tr.click{cursor:pointer} .xp-tbl tr.click:hover td{background:var(--gold-soft)}
.xp-sc{font-family:var(--display);font-size:17px}
.xp-sc.tA{color:var(--green-ink)} .xp-sc.tB{color:var(--gold-ink)} .xp-sc.tC{color:var(--ochre)} .xp-sc.tD{color:var(--red)}
.xp-tier{display:inline-grid;place-items:center;min-width:24px;height:22px;border-radius:6px;font-family:var(--mono);font-weight:700;font-size:11px;padding:0 6px}
.xp-tier.tA{background:var(--green);color:var(--on-green)} .xp-tier.tB{background:var(--gold);color:var(--on-gold)} .xp-tier.tC{background:var(--ochre);color:var(--on-ochre)} .xp-tier.tD{background:var(--red);color:var(--on-red)}
.xp-score{gap:14px}
.xp-gauge{width:100%;height:auto;display:block}
.xp-gauge .needle{transform-box:view-box;transform-origin:100px 100px;transform:rotate(var(--deg));animation:needle 1.2s var(--spring) both}
@keyframes needle{from{transform:rotate(-90deg)}}
.xp-big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.xp-big small{font-size:15px;color:var(--muted);font-weight:600;margin-left:2px}
.xp-manual{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;background:var(--ochre-soft);border:1.5px solid var(--ochre);border-radius:12px;padding:10px 12px;color:var(--ochre)}
.xp-manual .ic{grid-row:span 2;font-size:22px} .xp-manual b{font-family:var(--mono);font-size:12px;letter-spacing:.06em} .xp-manual span{font-size:12px;color:var(--body)}
.xp-wts{display:flex;flex-direction:column;gap:9px}
.xp-wts .wt{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.xp-wts b{color:var(--ink)}
.xp-wts .tr{height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.xp-wts .tr i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--deep),#c89a2e);transform-origin:left;animation:grow .9s var(--ease) both}
.xp-tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);overflow-x:auto}
.xp-tabs button{border:0;background:transparent;padding:9px 14px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.xp-tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:#c89a2e}
.xp-eng{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@container vp (max-width:720px){.xp-eng{grid-template-columns:minmax(0,1fr)}}
.eng{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;animation:cardin .45s var(--spring) both;min-width:0}
.eng .ei{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.eng.ok .ei{background:var(--green-soft);color:var(--green-ink)} .eng.wait .ei{background:var(--surface-3);color:var(--muted)} .eng.warn .ei{background:var(--ochre-soft);color:var(--ochre)} .eng.bad .ei{background:var(--red-soft);color:var(--red)}
.eng b{display:block;font-size:13px;color:var(--ink)} .eng span{font-size:11px;color:var(--muted)}
.eng code{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap}
.xp-chain{display:flex;flex-direction:column;gap:0}
.xp-chain .blk{display:flex;gap:12px;position:relative;padding-bottom:14px;animation:cardin .45s var(--spring) both}
.xp-chain .blk::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:repeating-linear-gradient(var(--gold) 0 4px,transparent 4px 8px)}
.xp-chain .blk:last-child::before{display:none}
.xp-chain .bi{width:28px;height:28px;border-radius:8px;background:var(--deep);color:#f0c95f;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;flex:0 0 auto}
.xp-chain b{display:block;font-family:var(--mono);font-size:12px;color:var(--ink)} .xp-chain span{font-size:12px;color:var(--muted);display:block}
.xp-chain code{font-family:var(--mono);font-size:10.5px;color:var(--green-ink);word-break:break-all}
.xp-mix{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.xp-mix i{display:block;animation:grow .9s var(--ease) both;transform-origin:left}
.vchip{margin-left:auto}

/* ---------- iPhone 17 Pro (402 × 874 pt, 62/34 safe areas, Dynamic Island) ---------- */
.fin-orange{--fin:linear-gradient(150deg,#f39a5c 0%,#d9652a 38%,#c4521b 62%,#ee8646 100%);--fin-d:#9d4213;--fin-btn:#c9561d}
.fin-blue{--fin:linear-gradient(150deg,#5a6b8c 0%,#34425f 40%,#27324a 65%,#4d5d7d 100%);--fin-d:#1b2335;--fin-btn:#2d3a55}
.fin-silver{--fin:linear-gradient(150deg,#f7f8fa 0%,#d3d6db 40%,#bfc3c9 65%,#eceef1 100%);--fin-d:#9aa0a8;--fin-btn:#b4b8be}
.frame.phone{width:426px;height:898px;padding:12px;border-radius:72px;background:var(--fin);transform-origin:top center;flex:0 0 auto;transition:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),inset 0 0 0 3px var(--fin-d),0 50px 90px -34px rgba(10,20,15,.55),0 0 0 .5px rgba(0,0,0,.35)}
.frame.phone .vp{width:402px;height:874px;border-radius:60px;box-shadow:0 0 0 9px #050506,0 0 0 9.6px rgba(255,255,255,.08)}
.stage{overflow:hidden;align-items:flex-start}
.frame .island,.frame .hw{display:none}
.frame.phone .island{display:block;position:absolute;top:23px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:20px;background:#000;z-index:30}
.frame.phone .island i{position:absolute;right:12px;top:50%;width:11px;height:11px;border-radius:50%;transform:translateY(-50%);background:radial-gradient(circle at 35% 35%,#34466b,#0c1018 60%)}
.frame.phone .hw{display:block;position:absolute;width:4px;background:var(--fin-btn);border-radius:2px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25)}
.frame.phone .hw-act{left:-3px;top:176px;height:32px}
.frame.phone .hw-v1{left:-3px;top:234px;height:60px}
.frame.phone .hw-v2{left:-3px;top:306px;height:60px}
.frame.phone .hw-pwr{right:-3px;top:262px;height:96px}
.frame.phone .hw-cam{right:-2px;top:552px;height:68px;width:3px;background:linear-gradient(180deg,#2a2a2e,#0f0f11 50%,#2a2a2e)}
.finish{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 5px;font-size:11.5px;font-weight:700;color:var(--body)}
.finish .fsw{width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2);cursor:pointer;padding:0;background:var(--fin)}
.finish .fsw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.frame.phone .statusbar{height:62px;display:flex;align-items:flex-start;justify-content:space-between;padding:21px 30px 0 46px;font-family:-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;font-size:17px;font-weight:600;letter-spacing:-.2px}
.sb-time{font-variant-numeric:tabular-nums}
.sb-ic{display:flex;gap:6px;align-items:center;margin-top:2px}
.sb-ic svg{height:12px;width:auto;fill:currentColor}
.batt{width:26px;height:12.5px;border:1.3px solid color-mix(in srgb,currentColor 55%,transparent);border-radius:4px;position:relative;padding:1.6px}
.batt i{display:block;height:100%;width:78%;background:currentColor;border-radius:1.8px}
.batt::after{content:"";position:absolute;right:-3.5px;top:3.6px;width:1.8px;height:4px;background:color-mix(in srgb,currentColor 55%,transparent);border-radius:0 1px 1px 0}
.app{position:relative}
.app .abody{padding-bottom:118px}
.frame:not(.phone) .homebar{display:none}
.homebar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:139px;height:5px;border-radius:3px;background:var(--ink);opacity:.9;z-index:9}
.tabbar,.stickycta{position:absolute;left:14px;right:14px;bottom:24px;z-index:8;border-radius:34px;
  background:color-mix(in srgb,var(--surface) 68%,transparent);backdrop-filter:blur(26px) saturate(1.9);-webkit-backdrop-filter:blur(26px) saturate(1.9);
  box-shadow:0 14px 34px -10px rgba(0,0,0,.32),inset 0 0 0 .6px color-mix(in srgb,#fff 55%,transparent),inset 0 1px 0 color-mix(in srgb,#fff 70%,transparent)}
.tabbar{height:66px;display:flex;padding:5px;gap:2px}
.tabbar button{flex:1;border:0;background:transparent;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--body);cursor:pointer;position:relative;transition:background .3s var(--ease),color .2s}
.tabbar button .ic{font-size:22px}
.tabbar button[aria-current="page"]{background:color-mix(in srgb,var(--role) 15%,transparent);color:var(--role-ink)}
.tabbar .cnt{position:absolute;top:3px;left:calc(50% + 5px);min-width:17px;height:17px;border-radius:9px;background:#ff3b30;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-family:var(--sans)}
.stickycta{display:flex;gap:8px;padding:8px}
.stickycta .im-btn{flex:1}
.frame:not(.phone) .tabbar,.frame:not(.phone) .stickycta{bottom:14px}

/* sheets */
.portal{position:relative}
.sheet-back{position:absolute;inset:0;background:rgba(5,12,9,.4);z-index:40;animation:fadein .25s ease both}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:30px 30px 0 0;padding:10px 18px 46px;display:flex;flex-direction:column;gap:12px;animation:sheetup .42s var(--spring) both;box-shadow:0 -12px 40px rgba(0,0,0,.25);max-height:88%;overflow:auto}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line-2);align-self:center}
.sheet-x{position:absolute;right:14px;top:12px;width:30px;height:30px;border-radius:50%;border:0;background:var(--surface-2);color:var(--body);display:grid;place-items:center;cursor:pointer}
.portal .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(440px,92%);border-radius:20px;padding:22px;animation:modalin .32s var(--spring) both}
.portal .sheet .grab{display:none}
@keyframes sheetup{from{transform:translateY(100%)}}
@keyframes modalin{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}}
@keyframes fadein{from{opacity:0}}
.sh-img{width:56px;height:56px;border-radius:12px;overflow:hidden;flex:0 0 auto}.sh-img svg{width:100%;height:100%;display:block}
.callring{width:64px;height:64px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;font-size:28px;position:relative}
.callring::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--green);animation:ping 1.4s infinite}

.reqban{border-radius:16px;padding:14px;background:linear-gradient(115deg,var(--gold-soft),var(--surface) 85%);border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.reqban b{display:block;color:var(--ink);font-size:14.5px;font-family:var(--display)} .reqban span{font-size:12px;color:var(--body)}
.promo{border-radius:16px;padding:14px;background:var(--deep);color:var(--on-deep);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.promo b{display:block;color:#f0c95f;font-family:var(--display);font-size:15px} .promo span{font-size:12px;color:var(--deep-sub)}
.sh2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sh2 h4{font-size:16px} .sh2 button,.linkbtn{border:0;background:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:0}

/* ================= XELOR layer ================= */
/* role colour contexts */
.r-pur{--role:var(--acc);--on-role:var(--on-acc);--role-ink:var(--acc-ink);--role-soft:var(--acc-soft)}
.r-sup{--role:var(--ochre);--on-role:var(--on-ochre);--role-ink:var(--ochre);--role-soft:var(--ochre-soft)}
.r-own{--role:var(--gold);--on-role:var(--on-gold);--role-ink:var(--gold-ink);--role-soft:var(--gold-soft)}
.r-stores{--role:var(--teal);--on-role:var(--on-teal);--role-ink:var(--teal);--role-soft:var(--teal-soft)}
.r-acct{--role:var(--bankfill);--on-role:var(--on-bank);--role-ink:var(--ink);--role-soft:var(--surface-3)}
.r-sup .statusbar,.r-sup .abar{background:var(--sup-bar);color:#fff8ee}
.r-own .abar .tt{color:var(--on-bar)}

/* brand + top bar */
.brand .mk{background:linear-gradient(150deg,#b23a5e,#7a2945 55%,#4a1628);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 12px -4px rgba(122,41,69,.6)}
.brand .mk svg{width:17px;height:17px}
.brand b span{color:var(--acc-ink)}
.vchip{margin-left:0}
.top-sp{flex:1}
.clockchip{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--body);padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.clockchip b{color:var(--ink);font-weight:700}
.clockchip .ic{color:var(--gold-ink)}
.clockchip.tick{animation:chipflash 1.2s var(--ease)}
@keyframes chipflash{0%{background:var(--gold-soft);border-color:var(--gold)}100%{background:var(--surface)}}
.themeb{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--body);font-size:16px;transition:transform .3s var(--spring)}
.themeb:hover{transform:rotate(-20deg)}
.demoflag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ochre);border:1px solid color-mix(in srgb,var(--ochre) 50%,transparent);background:var(--ochre-soft);border-radius:999px;padding:5px 10px;font-weight:700;white-space:nowrap}
@media (max-width:720px){.clockchip span.lng,.demoflag{display:none}}

/* tour bar station labels */
.tbar button::after{content:attr(data-st);position:absolute;left:50%;top:12px;transform:translateX(-50%);font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--deep-sub);white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.tbar button:hover::after,.tbar button.cur::after{opacity:1}
.tour{transition:box-shadow .3s}
.tour h2{animation:scrin .45s var(--ease) both}

/* rubber stamp (XELOR route card signature) */
.stamp{position:absolute;right:9px;bottom:8px;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;text-align:center;line-height:1.05;color:var(--acc);border:2px solid currentColor;outline:1px solid currentColor;outline-offset:-6px;transform:rotate(-12deg);opacity:.86;mix-blend-mode:var(--stamp-blend);pointer-events:none}
.stamp span{font-family:var(--sans);font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.stamp em{display:block;font-style:normal;font-family:var(--mono);font-size:8.5px;font-weight:700}
.stamp.gold{color:var(--gold-ink)}
.stamp.in{animation:stamp .6s var(--out) both}
.stamp.big{position:relative;right:auto;bottom:auto;width:76px;height:76px;flex:0 0 auto;margin:-6px 0 -10px}
.stamp.big span{font-size:11px}.stamp.big em{font-size:9.5px}
@keyframes stamp{0%{transform:rotate(-30deg) scale(2.1);opacity:0}55%{transform:rotate(-10deg) scale(.92);opacity:.95}75%{transform:rotate(-13deg) scale(1.04)}100%{transform:rotate(-12deg) scale(1);opacity:.86}}

/* route card */
.route{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.route-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;border-bottom:1px dashed var(--line)}
.route-h h4{font-size:14px}
.route-h .doc{font-family:var(--mono);font-size:11px;color:var(--muted)}
.cells{display:grid;grid-template-columns:repeat(9,minmax(86px,1fr));overflow-x:auto;scrollbar-width:thin}
.cell{position:relative;min-height:124px;padding:9px 10px;border:0;border-right:1px dashed var(--line);background:transparent;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;transition:background .2s}
.cell:last-child{border-right:0}
.cell:hover{background:var(--surface-2)}
.cell .n{font-family:var(--mono);font-size:10px;color:var(--muted)}
.cell b{font-size:12.5px;color:var(--ink);line-height:1.2}
.cell small{font-size:10.5px;color:var(--muted)}
.cell.now{background:var(--acc-soft)}
.cell.now::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--acc)}
.cell.now .n{color:var(--acc-ink);font-weight:700}
.cell.locked b{color:var(--muted)}
.cell .stamp{position:relative;right:auto;bottom:auto;width:46px;height:46px;align-self:flex-end;margin-top:auto;flex:0 0 auto}
.cell .stamp span{font-size:8.5px}.cell .stamp em{font-size:7.5px}

/* document sheet */
.docsheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;position:relative;min-width:0;box-shadow:0 1px 0 var(--line)}
.docsheet .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.docsheet .dh h4{font-size:16px}
.docsheet .no{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:2px}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:12.5px}
.parties small{display:block;color:var(--muted);font-size:10.5px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin-bottom:2px}
.parties b{color:var(--ink)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.tot td{font-weight:800;color:var(--ink);border-top:1.5px solid var(--line-2);font-family:var(--display);font-size:15px}
.tbl tr.hot td{background:var(--red-soft)}
.tbl tr.bump td{animation:rowflash 1.6s ease}
.tbl .s{font-size:11px;color:var(--muted)}
.delta{display:inline-block;margin-left:6px;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--green-ink);background:var(--green-soft);border-radius:4px;padding:0 4px;animation:lvpop .6s var(--spring)}

/* supplier picker + ranked answers */
.sup{display:flex;align-items:flex-start;gap:11px;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--surface);cursor:pointer;transition:border-color .2s,box-shadow .2s}
.sup:hover{border-color:var(--line-2)}
.sup.on{border-color:var(--role);box-shadow:0 0 0 3px color-mix(in srgb,var(--role) 16%,transparent)}
.sup .cbx{width:22px;height:22px;border-radius:7px;border:2px solid var(--line-2);display:grid;place-items:center;flex:0 0 auto;color:transparent;transition:all .25s var(--spring);margin-top:8px}
.sup.on .cbx{background:var(--role);border-color:var(--role);color:var(--on-role)}
.sup .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sup .tx b{font-size:13.5px;color:var(--ink);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sup .tx small{font-size:11.5px;color:var(--muted)}
.sup .stats{font-size:12px;color:var(--body)} .sup .stats b{display:inline;font-size:12px}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:13px;flex:0 0 auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.vbadge{display:inline-flex;align-items:center;gap:4px;padding:1px 7px 1px 5px;border-radius:999px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-ink);background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);white-space:nowrap;position:relative;overflow:hidden}
.vbadge::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 4.8s var(--ease) 1.2s infinite}
@keyframes sheen{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.cap{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:11.5px;color:var(--muted);line-height:1.35}
.cap em{font-style:normal;font-weight:700;color:var(--body)}
.cap .cb{flex:0 0 64px;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.cap .cb i{display:block;height:100%;background:var(--gold);border-radius:3px;transform-origin:left;animation:grow .9s var(--ease) both}
.weights{display:flex;height:8px;border-radius:5px;overflow:hidden;gap:2px}
.weights i{display:block;transform-origin:left;animation:grow .9s var(--ease) both}
.weights-k{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.weights-k span{display:inline-flex;align-items:center;gap:6px}
.weights-k span::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c)}
.ans{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);animation:cardin .45s var(--spring) both;min-width:0}
.ans.wait{background:var(--surface-2);border-style:dashed}
.ans.late{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.ans.won{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
.rank{width:32px;height:32px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-family:var(--display);font-size:14px;font-weight:800;background:var(--surface-3);color:var(--body);border:1px solid var(--line)}
.rank.first{background:var(--role);color:var(--on-role);border-color:transparent;box-shadow:0 0 0 4px color-mix(in srgb,var(--role) 18%,transparent)}
.ans .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ans h4{font-size:14.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ans .why{font-size:12.5px;color:var(--body)}
.proof{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--body);background:var(--surface-2);border-radius:10px;padding:8px 10px;border-left:2.5px solid var(--gold)}
.proof b{color:var(--ink)}
.proof.unk{border-left-color:var(--ochre);background:var(--ochre-soft);color:var(--ochre);flex-direction:row;gap:7px;align-items:flex-start}
.mets{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@container vp (max-width:760px){.mets{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mets .mk{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mets .mv{font-family:var(--display);font-weight:800;font-size:14.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.bar-s{height:4px;border-radius:2px;background:var(--surface-3);margin-top:3px;overflow:hidden}
.bar-s i{display:block;height:100%;background:var(--acc);border-radius:2px;transform-origin:left;animation:grow .9s var(--ease) both}
.ans .aact{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ans .aact small{font-size:11.5px;color:var(--muted)}
.tdots{display:inline-flex;gap:3px;vertical-align:middle}
.tdots i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.tdots i:nth-child(2){animation-delay:.2s}.tdots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}40%{opacity:1}}

/* one-transaction checklist */
.checks{display:flex;flex-direction:column;gap:9px}
.chk{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink);opacity:.38;transition:opacity .35s var(--ease)}
.chk .c{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);flex:0 0 auto;color:transparent;transition:all .35s var(--spring)}
.chk.on{opacity:1}
.chk.on .c{background:var(--green);border-color:var(--green);color:var(--on-green);transform:scale(1.08)}
.chk small{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:right}

/* legend: what's real */
.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@container vp (max-width:980px){.legend{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container vp (max-width:520px){.legend{grid-template-columns:minmax(0,1fr)}}
.legend > div{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface);display:flex;flex-direction:column;gap:7px;min-width:0}
.legend li{font-size:12px;color:var(--body);padding-left:13px;position:relative;line-height:1.4}
.legend li::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:2px;background:var(--line-2)}

/* passport row */
.passport{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@container vp (max-width:720px){.passport{grid-template-columns:minmax(0,1fr)}}
.passport > div{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:3px}
.passport b{font-family:var(--display);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.passport small{font-size:11.5px;color:var(--muted)}

/* message bubbles (supplier phone + previews) */
.thread{display:flex;flex-direction:column;gap:9px;background:var(--wa-bg);margin:-14px -14px 0;padding:14px;min-height:100%;background-image:radial-gradient(color-mix(in srgb,var(--ink) 5%,transparent) 1px,transparent 1px);background-size:14px 14px}
.bub{max-width:86%;background:var(--wa-in);border-radius:14px 14px 14px 4px;padding:9px 11px 6px;box-shadow:0 1px 1px rgba(0,0,0,.08);font-size:13px;line-height:1.45;color:var(--ink);animation:msgin .4s var(--spring) both;align-self:flex-start}
.bub.me{align-self:flex-end;border-radius:14px 14px 4px 14px;background:var(--wa-out)}
.bub .from{font-size:11.5px;font-weight:700;color:var(--acc-ink);margin-bottom:3px}
.bub dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px;margin:6px 0}
.bub dt{color:var(--muted)} .bub dd{margin:0;font-weight:600}
.bub .go{display:flex;justify-content:center;gap:6px;align-items:center;margin-top:8px;padding:9px 10px;border-radius:10px;background:var(--acc);color:var(--on-acc);font-weight:700;font-size:13px;border:0;width:100%;cursor:pointer;transition:transform .15s}
.bub .go:active{transform:scale(.97)}
.bub .go.dim{background:var(--surface-3);color:var(--muted);cursor:default}
.bub .t{font-size:10px;color:var(--muted);text-align:right;margin-top:3px;font-family:var(--mono)}
.bub ul{margin:4px 0 0;display:flex;flex-direction:column;gap:1px;font-size:12px}
.bub ul li::before{content:"· ";color:var(--muted)}
.sysnote{align-self:center;text-align:center;font-size:11px;color:var(--body);background:var(--wa-sys);border-radius:8px;padding:5px 10px;max-width:92%}
.typing{align-self:flex-start;background:var(--wa-in);border-radius:14px;padding:10px 12px}

/* supplier quote form */
.money{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;transition:border-color .2s,box-shadow .2s}
.money:focus-within{border-color:var(--role);box-shadow:0 0 0 3px color-mix(in srgb,var(--role) 18%,transparent)}
.money span{padding:0 4px 0 13px;font-family:var(--display);font-weight:800;color:var(--muted);font-size:18px}
.money input{flex:1;border:0;outline:0;background:transparent;padding:12px 12px 12px 4px;font-family:var(--display);font-weight:800;font-size:20px;min-width:0;font-variant-numeric:tabular-nums}
.qtotal{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;background:var(--deep);color:var(--on-deep);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden}
.qtotal::after{content:"";position:absolute;right:-30px;top:-40px;width:130px;height:130px;border-radius:50%;border:20px solid color-mix(in srgb,#f0c95f 18%,transparent)}
.qtotal small{display:block;font-size:11.5px;color:var(--deep-sub)}
.qtotal b{font-family:var(--display);font-size:28px;color:#f0c95f;font-variant-numeric:tabular-nums;position:relative;z-index:1}

/* owner app */
.amt{font-family:var(--display);font-weight:800;font-size:34px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.ring{width:64px;height:64px;flex:0 0 auto}
.ring circle{fill:none;stroke-width:7}
