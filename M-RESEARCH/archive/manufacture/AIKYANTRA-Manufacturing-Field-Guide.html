[]},{"name":"CMM and dimensional metrology laboratory","quantity":"1 laboratory","purpose":"Check geometry, dimensions and surface characteristics.","spec":"Measurement uncertainty and probe access must suit the tolerance; external calibration required.","sourceIds":["S3","S6"]},{"name":"Aqueous wash, rinse and drying line","quantity":"1","purpose":"Remove accepted process residues.","spec":"Chemistry, rinse quality, drying and validation matched to material and customer cleanliness requirement.","sourceIds":["S4","S5"]},{"name":"Controlled assembly and packing benches","quantity":"2","purpose":"Preserve cleanliness after final acceptance.","spec":"Segregation, compatible gloves and approved packing; cleanroom classification only if specified.","sourceIds":["S5"]},{"name":"CAD/CAM and inspection-programming workstations","quantity":"3","purpose":"Control machining and inspection revisions.","spec":"Licensed software, drawing security and revision traceability.","sourceIds":[]}],"process":[{"name":"Agree the drawing and acceptance plan","plain":"Decide exactly what the customer will accept.","detail":"Select a narrow part family and record material, datums, tolerances, surfaces and cleanliness obligations.","check":"Written drawing revision, inspection plan and approved special-process vendors.","machine":"Engineering workstations","sourceIds":[]},{"name":"Receive traceable material","plain":"Check the metal before cutting it.","detail":"Match alloy, certificates and heat identity to the order; quarantine doubtful stock.","check":"Material and certificate match; maintain lot identity.","machine":"Receiving and stock-preparation station","sourceIds":[]},{"name":"Program and prove the setup","plain":"Plan cuts and hold the part securely.","detail":"Design fixtures and cutting sequence; simulate and prove out on sample stock.","check":"Collision checks, first setup approval and tool plan.","machine":"CAD/CAM and CNC cell","sourceIds":["S2"]},{"name":"Machine the part","plain":"Remove metal to make the required shape.","detail":"Use controlled offsets and intermediate measurements; preserve revision and lot records.","check":"Key dimensions checked before the next operation.","machine":"Three-axis, five-axis or turning centre","sourceIds":["S2"]},{"name":"Deburr and inspect","plain":"Remove unwanted edges and measure the result.","detail":"Use specified edge treatment, then CMM and other suitable gauges.","check":"First-article report; measurements within agreed uncertainty and tolerance.","machine":"Deburring cell and metrology laboratory","sourceIds":["S3","S6"]},{"name":"Complete approved outside processes","plain":"Apply required surface treatments through qualified suppliers.","detail":"Send only to approved anodising, passivation or heat-treatment sources; recheck affected dimensions.","check":"Correct process certificate, surface condition and dimensional result.","machine":"Approved external processor","sourceIds":["S5"]},{"name":"Clean, assemble and pack","plain":"Protect the part from production residues.","detail":"Use the accepted cleaning recipe and packing materials; assemble only authorised subassemblies.","check":"Customer-specified residue, particle and visual checks; specialist analysis outsourced.","machine":"Wash/rinse/dry line and clean benches","sourceIds":["S4","S5"]},{"name":"Release the documented batch","plain":"Send the part with evidence of conformity.","detail":"Compile material, processing, inspection and revision records; control changes after approval.","check":"Customer first-article acceptance and final release authorisation.","machine":"Quality records and packing station","sourceIds":["S5"]}],"modelParts":[{"name":"Metal billet","meaning":"The traceable starting material."},{"name":"Machined mounting plate","meaning":"A flat component with specified holes and surfaces."},{"name":"Support bracket","meaning":"Holds another equipment component in position."},{"name":"Datum surfaces","meaning":"Reference faces used to locate and measure the part."},{"name":"Measuring probe","meaning":"Illustrates dimensional inspection."},{"name":"Clean protective pack","meaning":"Preserves the condition achieved during cleaning."}],"roadmap":[{"phase":"Define the customer part family","duration":"Months 0–3","actions":"Obtain drawings, identify a technical lead and audit available outside processors.","gate":"A customer-sponsored sample programme with measurable acceptance criteria."},{"phase":"Prove sample economics","duration":"Months 3–5","actions":"Use qualified subcontract capacity to test manufacturability; obtain machine and metrology quotations.","gate":"Accepted sample route and credible cycle-time/cost sheet."},{"phase":"Install and establish capability","duration":"Months 5–9","actions":"Fit out the leased shell, install machines and validate measurement systems.","gate":"Demonstrated process capability on the selected family."},{"phase":"Customer qualification","duration":"Months 9–15","actions":"Submit first articles, close audit findings and stabilise outside processes.","gate":"Written production approval; timetable remains customer dependent."},{"phase":"Controlled production ramp","duration":"Months 15–24","actions":"Increase accepted volume, track yield and delivery, then add adjacent part families.","gate":"Repeat orders and margins before another machine or cleaner process scope."}],"quality":[{"title":"Dimensional evidence","detail":"Select instruments with suitable measurement uncertainty, validate fixtures and report drawing-defined dimensions. A five-axis machine alone does not establish precision.","sourceIds":["S2","S3","S6"]},{"title":"Material and revision traceability","detail":"Link stock heat, operations, outside treatment and inspection to the shipped lot. Customer qualification determines the required management-system certificates.","sourceIds":[]},{"title":"Surface and cleanliness control","detail":"Define what contamination matters for each part. Semiconductor service cleaning illustrates the specialised controls needed; do not claim process-contact cleanliness from an ordinary wash.","sourceIds":["S5"]},{"title":"Change control","detail":"Obtain required approval before changing material, tool route, treatment supplier or cleaning chemistry after qualification.","sourceIds":[]}],"localisation":[{"part":"Machining, fixtures and inspection","route":"Make in India","detail":"Local engineering and conversion create the principal manufacturing value."},{"part":"Approved stock and outside processing","route":"Buy Indian / Outsource","detail":"Use Indian suppliers where alloy traceability and customer approval permit; origin must be documented."},{"part":"Machine tools and measurement systems","route":"Import initially / Buy Indian","detail":"Choose capability through trials and quotations; no domestic-origin assumption for the plant BOM."},{"part":"Special coatings and contamination analysis","route":"Outsource","detail":"Keep high-risk processes with approved specialists until demand and capability justify investment."}],"schemes":[{"name":"ECMS","status":"Policy audit reused from 19 September 2026; product classification required.","detail":"Only notified eligible products qualify. Category D has a ₹10 crore minimum eligible investment and a 25% capital incentive, with applications scheduled through 30 April 2027. This project's total cost is not automatically eligible investment; obtain a written classification and do not budget a grant. The same eligible cost cannot receive duplicate central support.","sourceIds":["S7"]},{"name":"Semicon 2.0 equipment support","status":"Starter project below the stated equipment-scheme scale.","detail":"The equipment route audited in September 2026 includes ₹300 crore minimum investment and ₹120 crore applicant revenue conditions, with 30% support. This starter factory is not assumed eligible; larger supported factories may create a customer ecosystem.","sourceIds":["S8"]}],"network":"Use the founder's network for introductions to equipment OEM sourcing teams, Applied Materials' India ecosystem, experienced supplier-quality leaders and CMTI metrology expertise. Obtain drawings and qualification access, not an assumed government purchase order.","risks":[{"risk":"A promising ecosystem produces no accessible drawings or orders.","response":"Secure a named customer qualification owner and paid sample scope before ordering all four CNC machines."},{"risk":"A low-priced part needs costly cleanliness or surface processing.","response":"Cost the complete approved process and rework yield before quoting."},{"risk":"Customer qualification consumes cash for many months.","response":"Stage equipment purchases and keep working capital separate from machine finance."},{"risk":"Rework and measurement disagreement destroy margins.","response":"Agree datum strategy, measurement uncertainty and first-article evidence early."}],"first90":["Recruit a lead with actual equipment-supplier qualification experience.","Seek three narrow part-family RFQs and identify which parts are non-process-contact.","Make representative samples through audited subcontractors and measure the complete cost.","Obtain comparable machine, metrology, cleaning and leased-site quotations.","Decide whether customer-approved demand supports a four-machine cell or a smaller first phase."],"sources":[{"id":"S1","title":"A new chapter for Applied Materials India","url":"https://www.appliedmaterials.com/us/en/newsroom/blogs/a-new-chapter-for-applied-materials-india.html","publisher":"Applied Materials","date":"Accessed 2026-09-20","supports":"India engineering and innovation ecosystem; does not establish demand for this starter's parts.","type":"Company"},{"id":"S2","title":"UMC-500SS five-axis machining centre","url":"https://www.haascnc.com/machines/vertical-mills/universal-machine/models/umc-500SS.html","publisher":"Haas Automation","date":"Accessed 2026-09-20","supports":"Indexed and simultaneous five-axis machining functions; no Indian installed price or achieved customer tolerance.","type":"Company"},{"id":"S3","title":"Industrial measuring systems","url":"https://www.zeiss.com/metrology/en/systems.html","publisher":"ZEISS","date":"Accessed 2026-09-20","supports":"Dimensional and surface metrology equipment categories; no prescribed starter-lab configuration.","type":"Company"},{"id":"S4","title":"Elmasystem Core","url":"https://www.elma-ultrasonic.com/en/elmasystem-core","publisher":"Elma","date":"Accessed 2026-09-20","supports":"Modular industrial cleaning, rinsing and drying equipment; customer-specific cleaning validation still required.","type":"Company"},{"id":"S5","title":"Semiconductor equipment and specialised cleaning services","url":"https://www.uct.com/services/cleaning/default.aspx","publisher":"Ultra Clean Holdings","date":"Accessed 2026-09-20","supports":"Specialised cleaning and contamination-control capabilities in semiconductor equipment servicing; does not make every machined part equally demanding.","type":"Company"},{"id":"S6","title":"Precision metrology and calibration","url":"https://cmti.res.in/precision-metrology-calibration/","publisher":"Central Manufacturing Technology Institute","date":"Accessed 2026-09-20","supports":"Bengaluru dimensional/metrology calibration ecosystem; confirm current scope and availability.","type":"Government"},{"id":"S7","title":"ECMS guidelines, 26 April 2025","url":"https://ecms.meity.gov.in/documents/ECMS%20Guidelines_26.04.2025.pdf","publisher":"MeitY","date":"Published 2025-04-26; policy status checked in parent audit 2026-09-19","supports":"Eligible product categories, Category D conditions and restrictions on duplicate central support; policy interpretation reused from parent audit.","type":"Government"},{"id":"S8","title":"Semicon 2.0 notified scheme","url":"https://egazette.gov.in/WriteReadData/2026/275860.pdf","publisher":"Government of India","date":"Policy audit 2026-09-19","supports":"Equipment support conditions, including scale and revenue thresholds; parent audit reused, not a new approval finding.","type":"Government"}],"researchNote":"Primary equipment and process pages were checked on 20 September 2026; scheme interpretation reuses the parent policy audit. All capacity, cost, area, utility, headcount and schedule numbers are analyst pre-feasibility assumptions. No customer drawings, quotations, approved supplier status or technology licence has been obtained. The 3D teaching model is not customer CAD or a manufacturing drawing."},{"id":"power-distribution","title":"AI-facility power distribution","shortTitle":"Power distribution","sector":"AI and industrial infrastructure","plain":"Build the electrical assemblies that divide incoming power safely among equipment circuits. Begin with AC distribution panels for data centres and industrial facilities.","analogy":"A carefully protected set of main roads and junctions that routes electricity to the right destination.","product":"Engineered low-voltage AC distribution boards with formed copper busbars, approved protection devices, labelled wiring and test documentation.","does":"Routes and protects electrical supplies while giving operators clear isolation, monitoring and maintenance points.","customers":["Data-centre electrical EPC contractors","Approved switchboard OEMs seeking manufacturing partners","Colocation and enterprise data-centre operators through their consultants","Industrial facilities and semiconductor-factory electrical contractors"],"whyNow":"ABB's announced India manufacturing expansion includes critical infrastructure products. NVIDIA's 800 VDC roadmap shows rising AI power-system demands, but it is a future architecture and a separate qualification problem. The starter sells defined AC distribution assemblies, not an assumed compatible 800 VDC system. [S1] [S2]","firstProduct":"Indoor 415 VAC distribution-board families, with an initial assumed 630–2,500 A range under an established, verified assembly design platform. Each contract specifies prospective fault current, enclosure, protection, environment and maintainability.","notIncluded":"No utility transformer, UPS power electronics, GPU power shelf, proprietary circuit breaker or complete 800 VDC system. Standalone busway is a separate product scope with its own applicable standard and verification.","entry":"Secure an appropriate OEM assembly-system agreement and an experienced panel-design lead. Form and finish approved copper busbars, assemble and wire in-house. Buy approved devices and outsource sheet-metal manufacture, coating, plating and high-power verification initially.","capacity":"Planning basis: 120–180 cubicles/year after qualification, one eight-hour shift and 250 working days. A complete distribution board may contain several cubicles; this is not a commitment to 180 complete switchboards.","budget":{"basis":"INR crore on a September 2026 planning basis. Leased existing industrial shell; land purchase and new-building civil works excluded. Recoverable GST excluded, working capital separate, no subsidy deducted. Includes fixed equipment and stated pre-operative launch allowances; not an accounting classification or vendor quotation.","items":[{"name":"Busbar processing cell","low":0.4,"high":0.8,"note":"Cutting, punching and bending equipment, tooling and handling."},{"name":"Mechanical assembly and wiring tools","low":0.35,"high":0.65,"note":"Benches, crimping, wire preparation and controlled torque tooling."},{"name":"Routine electrical verification equipment","low":0.45,"high":0.9,"note":"Suitable dielectric, insulation, continuity, low-resistance and functional-test instruments."},{"name":"Leased-shell fitout and utilities","low":0.65,"high":1.2,"note":"Segregated test bay, electrical supply, stores, fire provisions and handling."},{"name":"Design platform, CAD and fixtures","low":0.3,"high":0.6,"note":"Engineering software, tooling and initial design-system arrangements; commercial agreement requires quotation."},{"name":"External design verification allowance","low":0.65,"high":1.25,"note":"Representative testing, transport, expert support and possible retests; actual programme follows the selected design."},{"name":"Launch engineering and pilots","low":0.5,"high":0.9,"note":"Initial design work, prototype assemblies, training and documentation."},{"name":"Contingency","low":0.5,"high":0.9,"note":"Allowance for unresolved test scope and commissioning."}],"workingLow":3,"workingHigh":6,"workingNote":"Assumes substantial breaker/copper inventory and 60–90 day project receivables, with staged customer advances where negotiated. Bought-out equipment can dominate cash needs; guarantees, retention and longer EPC terms require separate provision.","landNote":"Land purchase and a new building are excluded. Budget assumes a leased suitable shell; greenfield plot size is only an alternate screening figure.","confidence":"Pre-feasibility allowance, not OEM pricing or a laboratory quotation. Protection-device mix, design rights and actual verification programme may materially change capital and working cash."},"site":{"builtup":"Assume 12,000–18,000 sq ft (approximately 1,115–1,672 m²) in an existing industrial building.","plot":"If greenfield: screen approximately 0.6–1.0 acre, subject to loading access, setbacks and expansion plan.","power":"Assume 100–160 kVA screening range for tools and ordinary routine verification. Short-circuit and major temperature-rise testing are outsourced and are not covered by this load.","water":"Assume 1–2 m³/day, mainly domestic use. No in-house plating or wet-coating line in this scope.","conditions":["Provide physically controlled electrical-test bays and isolation procedures.","Keep copper fabrication debris away from completed electrical assemblies.","Provide dry storage and lifting routes for heavy cubicles.","Check floor loading, dispatch clearances and emergency access before leasing."],"areas":[{"name":"Incoming materials and stores","share":20,"why":"Protect bought-out devices and segregate orders."},{"name":"Busbar fabrication","share":20,"why":"Cut, form and deburr copper."},{"name":"Mechanical assembly","share":25,"why":"Mount enclosure structure, supports and devices."},{"name":"Wiring","share":15,"why":"Complete identified power and control wiring."},{"name":"Verification and dispatch","share":10,"why":"Test safely and preserve finished panels."},{"name":"Engineering and support","share":10,"why":"Drawings, documentation and operating facilities."}]},"team":[{"role":"Plant lead","count":1,"why":"Own capacity, delivery and quality."},{"role":"Electrical/design engineers","count":4,"why":"Prepare verified configurations, drawings and protection interfaces."},{"role":"Busbar operators","count":3,"why":"Cut, punch, bend and inspect copper."},{"role":"Mechanical assembly technicians","count":6,"why":"Build cubicles and fit devices."},{"role":"Wiring technicians","count":4,"why":"Terminate and label power/control circuits."},{"role":"Test and quality engineers","count":3,"why":"Conduct routine verification and customer FAT."},{"role":"Procurement and stores","count":2,"why":"Manage device lead times and traceability."},{"role":"Administration and sales coordination","count":1,"why":"Coordinate project records and commercial follow-up."}],"teamNote":"24 people for one shift. The design-platform licensor, accredited test laboratory and site-installation contractor are additional outside resources.","machines":[{"name":"Hydraulic busbar cutting, punching and bending cell","quantity":"1","purpose":"Form rigid copper conductors to controlled drawings.","spec":"Cross-section range, bend radius, hole quality and tooling selected for approved busbar system.","sourceIds":["S4"]},{"name":"Drilling and edge-finishing station","quantity":"1","purpose":"Prepare supports and remove sharp copper edges.","spec":"No burrs or metal debris allowed in final assemblies; avoid unapproved changes to verified geometry.","sourceIds":["S4"]},{"name":"Wire cutting, stripping and crimping tools","quantity":"1 cell","purpose":"Prepare consistent cable and control-wire terminations.","spec":"Terminal, conductor and crimp tooling compatibility follows device instructions.","sourceIds":[]},{"name":"Assembly benches and controlled torque tools","quantity":"4 benches","purpose":"Build supports and tighten electrical joints repeatably.","spec":"Use specified fasteners, joint surfaces and torque; maintain calibration.","sourceIds":["S3"]},{"name":"Electrical design and drawing workstations","quantity":"3","purpose":"Manage single-line diagrams, BOMs and wiring revisions.","spec":"Use the selected assembly platform's design limits and device coordination data.","sourceIds":["S3"]},{"name":"Dielectric, insulation and continuity instrument set","quantity":"1 set","purpose":"Carry out applicable routine electrical verification.","spec":"Test method, voltage and sequence from applicable standard and approved instructions; not generic fixed settings.","sourceIds":["S5","S6"]},{"name":"Low-resistance and functional test instrument set","quantity":"1 set","purpose":"Check selected joints and protection/control functions.","spec":"Micro-ohmmeter and injection/test accessories matched to the ordered devices and inspection plan.","sourceIds":["S5","S6"]},{"name":"Handling and dispatch equipment","quantity":"1 set","purpose":"Move and pack completed cubicles safely.","spec":"Rated trolleys, lifting fixtures and packing designed around product mass.","sourceIds":[]}],"process":[{"name":"Translate the site requirement","plain":"Agree what the panel must supply and protect.","detail":"Obtain single-line diagram, load schedule, fault level, ambient conditions and consultant specifications.","check":"Approved technical specification and responsibility matrix.","machine":"Design workstations","sourceIds":["S5","S6"]},{"name":"Select a verified configuration","plain":"Stay within a proven assembly design.","detail":"Choose enclosure, conductors, supports, devices and cooling arrangement under the original manufacturer's instructions.","check":"Evidence covering the actual configuration; deviations require further verification.","machine":"Design platform and CAD","sourceIds":["S3","S5","S6"]},{"name":"Inspect incoming materials","plain":"Check copper, supports and devices.","detail":"Match dimensions, ratings and certificates; keep substituted components out of the approved BOM.","check":"Traceable accepted materials and correct device variants.","machine":"Incoming inspection station","sourceIds":["S3"]},{"name":"Form the copper conductors","plain":"Cut, punch and bend the electrical paths.","detail":"Produce geometry from controlled drawings; remove burrs and outsource any required plating.","check":"Dimensions, surface condition and joint locations match approved design.","machine":"Busbar processing cell","sourceIds":["S4"]},{"name":"Build the mechanical assembly","plain":"Fit devices and their supports.","detail":"Maintain clearances and conductor support arrangement; apply approved fasteners and joints.","check":"Mounting, separation and documented joint torque.","machine":"Assembly benches and torque tools","sourceIds":["S3","S5","S6"]},{"name":"Wire and identify circuits","plain":"Connect controls, meters and outgoing circuits.","detail":"Use approved terminal methods, wire sizes, protection settings and durable labels.","check":"Drawing-to-wire check and correct identification.","machine":"Wire-preparation tools and benches","sourceIds":["S5","S6"]},{"name":"Perform routine verification and FAT","plain":"Check the finished assembly before shipping.","detail":"Follow the applicable routine-verification plan; demonstrate ordered controls and records to the customer.","check":"Signed test results and closed defects; design verification remains a separate obligation.","machine":"Electrical and functional test instruments","sourceIds":["S5","S6"]},{"name":"Preserve, dispatch and support installation","plain":"Deliver the assembly with usable documentation.","detail":"Pack for transport; provide lifting, installation, settings and maintenance information.","check":"Release pack, serial identity and installation responsibilities agreed.","machine":"Handling and dispatch station","sourceIds":["S3"]}],"modelParts":[{"name":"Incoming breaker","meaning":"Connects and protects the board's incoming supply."},{"name":"Main copper busbars","meaning":"Carry power along the board."},{"name":"Outgoing protective devices","meaning":"Protect individual downstream circuits."},{"name":"Insulating supports","meaning":"Hold live conductors in their verified positions."},{"name":"Protective earth bar","meaning":"Provides the intended protective bonding connection."},{"name":"Metering and control section","meaning":"Shows operating status and supports agreed controls."}],"roadmap":[{"phase":"Confirm application and design partner","duration":"Months 0–2","actions":"Choose AC product family, identify assembly-platform terms and obtain three target project specifications.","gate":"Named technical authority and a feasible approved configuration."},{"phase":"Prototype and cost the complete BOM","duration":"Months 2–4","actions":"Obtain device, copper, enclosure and laboratory quotes; build a representative prototype.","gate":"Credible product cost and verification plan with design rights resolved."},{"phase":"Install and verify","duration":"Months 4–7","actions":"Set up the cell, train staff and complete the necessary design-verification programme.","gate":"Applicable evidence for the actual assembly family and trained test personnel."},{"phase":"Pilot customer deliveries","duration":"Months 7–10","actions":"Produce controlled batches, conduct FATs and record installation feedback.","gate":"Accepted deliveries and closed quality issues."},{"phase":"Ramp repeat configurations","duration":"Months 10–15","actions":"Improve purchasing and assembly flow; extend configurations only within verified limits.","gate":"Repeat orders, cash collection and field reliability justify expansion."}],"quality":[{"title":"Assembly-level verification","detail":"IEC 61439-1 gives general rules and is used with the relevant product part; IEC 61439-2 covers power switchgear and controlgear assemblies. Device certificates alone do not verify a finished board.","sourceIds":["S5","S6"]},{"title":"Design changes","detail":"Maintain the original manufacturer's permitted configurations. Changing a breaker, busbar support or ventilation detail may affect the verification evidence.","sourceIds":["S3","S5","S6"]},{"title":"Routine testing and safe FAT","detail":"Verify each completed assembly using the applicable standard and agreed inspection plan. Protect personnel through controlled access, isolation and suitable instruments.","sourceIds":["S5","S6"]},{"title":"External high-power testing","detail":"Discuss required tests, laboratory scope, sample configuration and scheduling with a capable accredited facility such as CPRI. Laboratory presence does not establish certification or an available test slot.","sourceIds":["S7"]}],"localisation":[{"part":"Copper busbar fabrication, assembly and wiring","route":"Make in India","detail":"Own local design execution, conversion, testing and service documentation."},{"part":"Enclosures and coating","route":"Outsource / Buy Indian","detail":"Use approved Indian fabricators while preserving required geometry and finish."},{"part":"Breakers, relays and meters","route":"Buy Indian / Import initially","detail":"Purchase approved variants; local brand presence does not prove Indian origin of each SKU."},{"part":"High-power verification","route":"Outsource","detail":"Avoid building a dedicated short-circuit laboratory for the first plant."}],"schemes":[{"name":"ECMS and manufacturing incentives","status":"No blanket eligibility assumed for an electrical-panel factory.","detail":"The notified product category and eligible investment must match the application. General data-centre growth does not make every power-distribution product eligible. Obtain product-specific written advice; no subsidy is deducted from this budget and the same central eligible cost must not be claimed twice.","sourceIds":["S8"]}],"network":"Use introductions to data-centre EPC procurement, electrical consultants, approved assembly-platform OEMs and Karnataka industrial projects. The strongest early network outcome is inclusion in a technically suitable vendor list and a paid pilot order; a political connection does not remove technical approvals or procurement rules.","risks":[{"risk":"Project opportunities require approvals the new supplier does not hold.","response":"Enter through a qualified assembly partner and agree the exact responsibility for design evidence."},{"risk":"Copper and protection-device purchases consume cash before customer payment.","response":"Negotiate advances, milestone billing and procurement against approved drawings."},{"risk":"A configuration change invalidates existing evidence.","response":"Control BOM and drawings and require engineering sign-off on every substitution."},{"risk":"The AI power roadmap changes faster than the initial product.","response":"Sell the defined AC range first; treat 800 VDC as a separately funded partner programme."}],"first90":["Select a single AC assembly family and hire an experienced design authority.","Meet three EPC/consultant sourcing teams and request actual specification packs.","Get assembly-platform terms plus comparable breaker, copper and enclosure quotations.","Agree the representative verification programme and obtain laboratory quotations.","Build and cost one pilot configuration before committing to the full factory."],"sources":[{"id":"S1","title":"ABB invests $75 million in India to expand manufacturing and R&D","url":"https://www.abb.com/global/en/news/133972/abb-invests-75-million-in-india-to-expand-manufacturing-and-rd-for-critical-segments","publisher":"ABB","date":"2026 announcement; evidence reused from 2026-09-19 research","supports":"India manufacturing investment and critical-infrastructure ecosystem; does not establish customer access or pricing.","type":"Company"},{"id":"S2","title":"800 VDC power architecture for AI factories","url":"https://blogs.nvidia.com/blog/800-vdc-power-architecture-ai-factory/","publisher":"NVIDIA","date":"2026 announcement; evidence reused from 2026-09-19 research","supports":"AI power-architecture direction and roadmap; not a design certification for the starter product.","type":"Company"},{"id":"S3","title":"Power distribution systems","url":"https://www.rittal.com/us-en_US/Solutions-Home/Industrial-Products/Power-distribution","publisher":"Rittal","date":"Accessed 2026-09-20","supports":"Established assembly-system approach and components; no available partnership or blanket certification assumed.","type":"Company"},{"id":"S4","title":"Hydraulic tools for conductor fabrication","url":"https://www.nvent.com/en-me/eriflex/products/hydraulic-tools","publisher":"nVent ERIFLEX","date":"Accessed 2026-09-20","supports":"Cutting, punching and bending tooling for busbars; no installed-price evidence.","type":"Company"},{"id":"S5","title":"IEC 61439-1:2020","url":"https://webstore.iec.ch/en/publication/32338","publisher":"International Electrotechnical Commission","date":"Accessed 2026-09-20","supports":"General rules and verification framework for low-voltage assemblies; public catalogue reviewed, full standard not reproduced.","type":"Standard"},{"id":"S6","title":"IEC 61439-2:2020","url":"https://webstore.iec.ch/en/publication/30043","publisher":"International Electrotechnical Commission","date":"Accessed 2026-09-20","supports":"Power switchgear/controlgear assembly scope; application requires the full applicable standard.","type":"Standard"},{"id":"S7","title":"High Power Laboratory","url":"https://www.cpri.res.in/index.php/en/High-Power-Laboratory-HPL","publisher":"Central Power Research Institute","date":"Accessed 2026-09-20","supports":"Bengaluru high-power testing ecosystem; exact test scope, accreditation and booking need confirmation.","type":"Government"},{"id":"S8","title":"ECMS guidelines, 26 April 2025","url":"https://ecms.meity.gov.in/documents/ECMS%20Guidelines_26.04.2025.pdf","publisher":"MeitY","date":"Published 2025-04-26; policy status checked in parent audit 2026-09-19","supports":"Incentives apply to notified eligible categories and expenditure, not all infrastructure products; parent policy audit reused.","type":"Government"}],"researchNote":"Fresh primary machine, assembly-system and standards catalogue checks were made on 20 September 2026; demand and policy evidence identified above is reused from prior research. Costs, capacity, staffing, site, utility and schedule ranges are analyst assumptions. No OEM agreement, vendor quotation, customer order or certification has been secured. The educational 3D assembly is not an electrical design or installation guide."},{"id":"connectors","title":"High-voltage connectors and cable assemblies","shortTitle":"HV connectors","sector":"EV and industrial electrical components","plain":"This factory makes detachable electrical joints between an EV battery, its DC power-distribution system and the input of its power controller. Its first product combines a sealed connector with a short heavy-duty cable.","analogy":"A rugged plug and socket for the much larger electrical loads inside an electric vehicle.","product":"A licensed two-pole connector pair, panel receptacle and customer-specific cable jumper, supplied with serialised inspection records.","does":"Allows high-current equipment to be assembled and serviced while keeping the connection insulated, sealed and mechanically secure.","customers":["Battery-pack and power-distribution-unit manufacturers","Electric bus, truck and specialist vehicle manufacturers","Traction-inverter and industrial converter manufacturers","Tier-1 harness suppliers buying a qualified connector family"],"whyNow":"Established suppliers offer shielded HV connectors with interlock circuits for batteries, inverters and power distribution [CON1]. Indian manufacturing already exists [CON5]; the opportunity is a buyer-approved alternative for particular imported part numbers, with local engineering and shorter replenishment.","firstProduct":"One two-pole, shielded, sealed connector platform with a high-voltage interlock, targeting up to 1,000 V DC and roughly 150–250 A. These are development targets: the released rating must follow cable size, ambient-temperature derating and qualification.","notIncluded":"CCS vehicle charging inlets, signal/data connectors, relays, switches, complete vehicle wiring looms and in-house electroplating. The licence must cover the exact chosen design; catalogue examples are not permission to copy it.","entry":"Recruit a connector design/process leader and license a proven platform, including drawings, material specifications, crimp tooling and qualification support. Secure one customer programme before ordering production moulds. Make insulating inserts and turned contacts locally; purchase approved spring contacts initially and outsource plating.","capacity":"Planning case: 50,000 connector-and-jumper sets annually at maturity, one eight-hour shift over 250 working days. The target is 200 sets per day; customer variants and test time determine actual output.","budget":{"basis":"INR crore, 2026 pre-feasibility planning allowances for a leased industrial shell. Land purchase, new building construction and recoverable GST excluded. No subsidy deducted; working capital separate.","items":[{"name":"Contact machining and auxiliary equipment","low":1.4,"high":2.6,"note":"Two CNC turning centres, handling and basic finishing; planning allowance."},{"name":"Moulding equipment and initial mould family","low":1.6,"high":3,"note":"Two small moulding presses, dryers, chiller and outsourced precision moulds."},{"name":"Cable preparation and assembly cells","low":0.8,"high":1.5,"note":"Cutting, shield preparation, monitored crimping and assembly fixtures."},{"name":"Inspection and product validation equipment","low":0.8,"high":1.6,"note":"Electrical, dimensional and crimp inspection; specialised external validation also needed."},{"name":"Shell fit-out, utilities and traceability","low":0.8,"high":1.4,"note":"Electrical distribution, compressed air, segregated areas and serialisation."},{"name":"Technology access and launch engineering","low":0.8,"high":1.8,"note":"Provisional licence, training, trials and validation allowance; no partner quotation obtained."},{"name":"Contingency","low":0.9,"high":1.7,"note":"Design changes, commissioning and initial tooling corrections."}],"workingLow":2,"workingHigh":4,"workingNote":"Separate allowance for copper, resins, purchased contacts, pilot scrap and receivables during ramp-up; model customer payment terms before commitment.","landNote":"Lease deposit is within launch/site allowances. Buying land or constructing a new shell requires a separate site-specific budget.","confidence":"Planning estimate only. Machine RFQs, a licensed design and customer validation plan are needed to narrow the range.","totalLow":7.1,"totalHigh":13.6,"fundingLow":9.1,"fundingHigh":17.6},"site":{"builtup":"Assume 20,000 sq ft, approximately 1,860 sq m, of usable industrial space.","plot":"If greenfield: screen roughly 1–1.5 acres for a comparable first phase, subject to setbacks, parking and utility layout.","power":"Screen a 200–350 kVA connection; obtain the supplier load list and diversity calculation before applying for sanctioned power.","water":"Assume 2–4 kilolitres daily for people and cooling-system make-up; mould cooling recirculates. No wet plating line is included.","conditions":["Separate machining chips and oils from connector assembly.","Dry and identify resins; control dust around contact assembly.","Provide inspection lighting, compressed air and safe electrical-test enclosures."],"areas":[{"name":"Machining","share":20,"why":"Turn contacts and inspect intermediate dimensions."},{"name":"Moulding","share":20,"why":"Make insulating inserts and handle moulds."},{"name":"Cable and connector assembly","share":25,"why":"Prepare cables and assemble the finished connection."},{"name":"Quality laboratory","share":12,"why":"Electrical, dimensional and crimp checks."},{"name":"Stores and dispatch","share":13,"why":"Segregate approved material and finished goods."},{"name":"Utilities and offices","share":10,"why":"Support services and engineering."}]},"team":[{"role":"Plant and programme leadership","count":2,"why":"Own delivery, costs and customer changes."},{"role":"Product and process engineers","count":4,"why":"Manage drawings, moulding, contacts and assembly."},{"role":"Quality and validation","count":4,"why":"Inspect product and maintain customer evidence."},{"role":"Tool setters and maintenance","count":4,"why":"Set moulds, maintain machines and fixtures."},{"role":"Machining and moulding operators","count":6,"why":"Run the two production areas."},{"role":"Assembly and electrical-test operators","count":12,"why":"Prepare cables and build/test connectors."},{"role":"Stores and planning","count":2,"why":"Control lots, materials and shipments."},{"role":"Sales, purchasing and administration","count":3,"why":"Support customer programmes and operations."}],"teamNote":"37 people at the stated one-shift maturity case; temporary licensor specialists and external test laboratories are additional.","machines":[{"name":"CNC turning centres","quantity":"2","purpose":"Machine copper-alloy contacts.","spec":"RFQ against contact drawings, material machinability, surface finish and tolerance capability.","sourceIds":["CON1"]},{"name":"Injection-moulding cells","quantity":"2","purpose":"Mould insulating inserts.","spec":"Choose shot size and clamping force from the licensed mould and engineering resin; include drying and cooling.","sourceIds":["CON3"]},{"name":"Cable preparation station","quantity":"1 modular cell","purpose":"Cut cable and remove the required insulation and shield.","spec":"Cable diameter, shield construction and supported preparation methods are customer-specific.","sourceIds":["CON2"]},{"name":"Monitored crimp press","quantity":"1–2","purpose":"Join the cable conductor to its contact.","spec":"Use matched applicators with force monitoring and validated cable-contact combinations.","sourceIds":["CON2"]},{"name":"Connector assembly fixtures","quantity":"4 benches","purpose":"Install seals, inserts, housing and interlock parts.","spec":"Error-proof orientation, controlled torque and recorded part identity.","sourceIds":["CON1","CON2"]},{"name":"Electrical and leak-test stations","quantity":"2","purpose":"Check the completed assembly.","spec":"Specify resistance, insulation, withstand, interlock continuity and leak methods from the customer test plan.","sourceIds":["CON4"]},{"name":"Crimp and dimensional laboratory","quantity":"1 set","purpose":"Inspect crimp strength, sections and critical dimensions.","spec":"Pull tester, microsection preparation, microscope and optical dimensional equipment.","sourceIds":["CON2","CON4"]},{"name":"Temperature-rise and cycling equipment","quantity":"1 development set","purpose":"Check heating and ageing of sample assemblies.","spec":"Current source, temperature channels and chamber capacity matched to sample size; outsource vibration and specialist ingress tests initially.","sourceIds":["CON4"]}],"process":[{"name":"Freeze the customer interface","plain":"Agree exactly what must connect.","detail":"Turn mating drawings, cable size and environment into a controlled product specification.","check":"Customer and licensor approve the interface and test plan.","machine":"Engineering tools and drawings","sourceIds":["CON1","CON4"]},{"name":"Make contacts and insulators","plain":"Shape the metal and insulating parts.","detail":"Turn contact blanks and mould inserts; approved suppliers plate contacts and supply housing parts.","check":"Critical dimensions, resin identity and plating certificates accepted.","machine":"CNC turning centres; injection-moulding cells","sourceIds":["CON1","CON3"]},{"name":"Prepare and terminate cable","plain":"Cut and join the cable.","detail":"Remove insulation and shield in the specified geometry, then crimp with matched tooling.","check":"Crimp force, periodic pull tests and sections meet the released limits.","machine":"Cable preparation station; monitored crimp press","sourceIds":["CON2"]},{"name":"Assemble the connection","plain":"Fit the parts in the right order.","detail":"Add seals, housing, interlock and secondary locks; record assembly identity.","check":"Presence, orientation and torque checks pass.","machine":"Connector assembly fixtures","sourceIds":["CON2"]},{"name":"Test every assembly","plain":"Find manufacturing defects before shipping.","detail":"Apply the approved electrical and seal-screening sequence.","check":"All results linked to the product serial number.","machine":"Electrical and leak-test stations","sourceIds":["CON4"]},{"name":"Validate and release the batch","plain":"Confirm it survives the intended use.","detail":"Use sample environmental and temperature-rise tests, review traceability and package accepted goods.","check":"Customer qualification and batch-release requirements satisfied.","machine":"Temperature-rise equipment; quality laboratory","sourceIds":["CON4"]}],"modelParts":[{"name":"Outer housing","meaning":"Protects and aligns the connection."},{"name":"Insulating insert","meaning":"Separates the live metal parts."},{"name":"Power contacts","meaning":"Carry the electrical current."},{"name":"Seal","meaning":"Limits water and dust entry when correctly assembled."},{"name":"Interlock loop","meaning":"Signals whether the high-voltage connector is properly engaged."},{"name":"Cable and shield","meaning":"Carry power and manage electromagnetic interference."}],"roadmap":[{"phase":"Define a customer programme","duration":"Months 0–2","actions":"Select one mating interface and identify the imported part being replaced.","gate":"Buyer specification and qualification route agreed."},{"phase":"Secure design rights","duration":"Months 2–4","actions":"Negotiate licence scope and build outsourced samples.","gate":"Design rights and sample acceptance established."},{"phase":"Install the pilot factory","duration":"Months 4–8","actions":"Order moulds and equipment, prepare the shell and train operators.","gate":"Machine capability and safe operation demonstrated."},{"phase":"Qualify the product","duration":"Months 8–14","actions":"Run environmental, electrical and durability tests and customer production trials.","gate":"Written customer release; timing may extend."},{"phase":"Ramp a repeatable family","duration":"Months 14–18+","actions":"Increase output and qualify a second customer using the same platform.","gate":"Stable yield, field performance and repeat orders."}],"quality":[{"title":"Connector test specification","detail":"Use relevant IEC 60512 methods with the customer's product-specific severity and acceptance limits; the generic standard is not a product approval.","sourceIds":["CON4"]},{"title":"Automotive release","detail":"Where requested, complete the OEM's design validation, process approval and traceability requirements. Any ingress rating applies only to the tested mating condition.","sourceIds":["CON1","CON4"]}],"localisation":[{"part":"Contacts and insulating inserts","route":"Make in India","detail":"Local turning and moulding create manufacturing depth."},{"part":"Housing, cable and packaging","route":"Buy Indian","detail":"Qualify domestic sources against the licensed specification."},{"part":"Plating and specialised environmental tests","route":"Outsource","detail":"Use approved external facilities initially."},{"part":"Contact springs, special resin grades and selected machines","route":"Import initially","detail":"Replace only after equivalent material and process qualification."}],"schemes":[{"name":"ECMS connector category","status":"Application window closed as displayed by the portal on 20 September 2026.","detail":"The connector category's minimum investment is much larger than this starter scope. No ECMS receipt is included; an approved partner project requires separate eligibility review.","sourceIds":["CON6","CON7"]}],"network":"Use the stated network for introductions to OEM platform engineering, supplier development and accredited test facilities. Request an approved drawing, nominated buyer and sample programme; introductions cannot replace technical approval or create a government purchase order.","risks":[{"risk":"The mating design is protected or proprietary.","response":"Obtain clear manufacturing and sales rights before tooling."},{"risk":"Contact resistance rises after vibration or ageing.","response":"Validate the complete contact, plating, cable and seal combination."},{"risk":"Too many customer variants consume tooling cash.","response":"Launch one platform with controlled variants."},{"risk":"Local assembly still contains expensive imported parts.","response":"Track Indian value addition by bill of material, not product labels."}],"first90":["Obtain specifications and sample acceptance criteria from two potential buyers.","Shortlist a licensor and agree what IP and process training transfer.","Request moulding, turning, plating and validation quotations against the same design.","Build a costed bill of material and samples before committing production capex."],"sources":[{"id":"CON1","title":"PowerLok G1 300/500 Series","url":"https://amphenol-aipg.com/product/powerlok-g1-300-500-series/","publisher":"Amphenol Industrial","date":"Accessed 20 September 2026","supports":"Existing shielded HV connector product class, application and rating variables; not a licence or a price quotation.","type":"Company"},{"id":"CON2","title":"Automated assembly of high-voltage cables","url":"https://www.komaxgroup.com/en/expertise/high-voltage","publisher":"Komax","date":"Accessed 20 September 2026","supports":"Configurable cable preparation, assembly automation, quality monitoring and traceability.","type":"Company"},{"id":"CON3","title":"Customer Center: electronics moulding applications","url":"https://www.arburg.com/en/tw/technology-days-info-material/customer-center/","publisher":"ARBURG","date":"Accessed 20 September 2026","supports":"Injection-moulding applications for connector housings and related insulating components; not assumed machine price.","type":"Company"},{"id":"CON4","title":"IEC 60512-1:2018","url":"https://webstore.iec.ch/en/publication/26491","publisher":"International Electrotechnical Commission","date":"22 October 2018; accessed 20 September 2026","supports":"Connector testing framework and need for product-specific acceptance requirements.","type":"Standard"},{"id":"CON5","title":"Amphenol High Speed Technology India ISO 9001 certificate","url":"https://www.amphenol-cs.com/media/wysiwyg/files/documentation/certification/ahst-india-iso9001.pdf","publisher":"Amphenol","date":"23 October 2025; reviewed in earlier evidence audit","supports":"Existing connector manufacturing in Electronic City; does not identify the proposed HV SKU.","type":"Company"},{"id":"CON6","title":"ECMS scheme guidelines","url":"https://ecms.meity.gov.in/documents/ECMS%20Guidelines_26.04.2025.pdf","publisher":"MeitY","date":"2025; accessed 20 September 2026","supports":"Category-specific investment and incentive conditions; no grant assumed.","type":"Government"},{"id":"CON7","title":"ECMS application portal","url":"https://ecms.meity.gov.in/","publisher":"MeitY","date":"Accessed 20 September 2026","supports":"A/B/C/E window closed 30 September 2025; D window runs to 30 April 2027.","type":"Government"}],"researchNote":"Product and process examples are supported by primary sources. The selected factory, capacity, budget, staffing, utility ranges and schedule are our planning assumptions, not supplier quotations. No buyer commitment, licensor offer or niche import percentage is established.","teamTotal":37,"factoryNote":"This is a proposed starter-factory configuration, not a vendor-engineered plant. Product ratings, permits, layout and utility connections must be confirmed before investment."},{"id":"production-test-machines","title":"Battery-pack production test machines","shortTitle":"Production test machines","sector":"EV manufacturing equipment","plain":"This factory builds the machines that check a battery pack before it leaves its production line. It sells an engineered test station, its software and ongoing service.","analogy":"A factory checkout desk that verifies a battery's identity, electrical health and assembly before dispatch.","product":"A modular end-of-line test station with a guarded fixture, electrical instruments, battery communication software, leak-test option and traceable results.","does":"Helps a battery manufacturer catch assembly faults, document each shipped pack and change test recipes as products evolve.","customers":["EV battery-pack manufacturers","Commercial-vehicle OEM battery plants","Stationary energy-storage pack manufacturers","Production-line integrators needing an Indian test-station partner"],"whyNow":"Ador Digatron already offers modular battery-pack EOL testing in India [TST1], and Chroma publishes a configurable production-test platform [TST2]. This validates a real equipment category and existing competition. A new supplier must win on a defined pack programme, integration capability, delivery and service.","firstProduct":"One configurable 200–800 V battery-pack EOL platform, with a roughly 60 kW bidirectional test-power option, BMS communication, insulation/withstand testing and customer-specified leak testing. Voltage, current and throughput remain engineering targets for the selected pack.","notIncluded":"Battery manufacturing, destructive abuse testing, complete cell formation plants, accredited battery certification services and production of the power semiconductor instruments inside the station.","entry":"Hire an experienced automation/test lead and collaborate with an established instrument supplier. Own the station architecture, fixtures, electrical panels, test sequencing, traceability and service. Purchase calibrated power stages and measurement instruments; outsource sheet-metal and precision fixture manufacture initially.","capacity":"Planning case: 24 stations per year after ramp-up, one shift, two parallel assembly/commissioning bays. This is a project-delivery assumption, not an order forecast or battery-testing throughput.","budget":{"basis":"INR crore, 2026 pre-feasibility estimate for a leased industrial shell; land, new building construction and recoverable GST excluded. No subsidy netted. Customer machines being built are funded through separate working capital.","items":[{"name":"Reference power and battery-emulation equipment","low":0.8,"high":1.5,"note":"Reusable development and factory-acceptance equipment, not every delivered customer's power rack."},{"name":"Electrical instruments and calibration references","low":0.4,"high":0.8,"note":"Insulation, voltage/current, data acquisition and reference measurement."},{"name":"Panel assembly and mechanical build tools","low":0.3,"high":0.6,"note":"Wire preparation, crimping, controlled torque, lifting and workbenches."},{"name":"Guarded test bays and utilities","low":0.5,"high":1,"note":"Power distribution, isolation, enclosures and approved ventilation/fire arrangements."},{"name":"Software platform and engineering launch","low":0.6,"high":1.1,"note":"Reusable sequencing, data handling, mechanical/electrical design and prototype work."},{"name":"Demonstrator, qualification and field launch","low":0.5,"high":0.9,"note":"First demonstration machine, outside reviews and initial commissioning capability."},{"name":"Contingency","low":0.5,"high":0.9,"note":"Integration changes, tooling rework and commissioning allowance."}],"workingLow":2.5,"workingHigh":5,"workingNote":"Assume several customer stations overlap in build. Cover bought-in instruments, customer-specific fixtures, payroll and receivables; seek engineering and dispatch milestones rather than financing whole projects unsecured.","landNote":"New land/buildings excluded; modest lease deposit within site/launch allowances.","confidence":"Planning estimate; needs a defined test recipe, instrument quotations and customer payment milestones.","totalLow":3.6,"totalHigh":6.8,"fundingLow":6.1,"fundingHigh":11.8},"site":{"builtup":"Assume 15,000 sq ft, about 1,390 sq m, for engineering, two build bays and controlled testing.","plot":"Greenfield alternative: screen 0.75–1.25 acres, subject to access, setbacks and the battery-test hazard assessment.","power":"Screen 200–350 kVA. Regenerative test equipment requires a utility and power-quality review; regeneration does not remove connection or protection requirements.","water":"Assume 1–3 kilolitres daily for people and limited closed-loop cooling make-up; no wet manufacturing process.","conditions":["Separate live battery testing from panel assembly and offices.","Provide interlocked enclosures, isolation and emergency response designed for the actual customer packs.","Use pack simulators for routine development; establish a controlled area for customer packs and suspect returns."],"areas":[{"name":"Machine assembly","share":30,"why":"Build and wire two customer projects."},{"name":"Guarded test bays","share":20,"why":"Commission and verify equipment."},{"name":"Engineering and software","share":20,"why":"Design the reusable product platform."},{"name":"Instrument and panel benches","share":12,"why":"Wire, inspect and calibrate subsystems."},{"name":"Stores and dispatch","share":10,"why":"Control expensive project material."},{"name":"Utilities and support","share":8,"why":"Maintain services and staff facilities."}]},"team":[{"role":"Programme and operations leadership","count":2,"why":"Own schedules, contracts and delivery."},{"role":"Test software and data engineers","count":5,"why":"Build recipes, communication and traceability."},{"role":"Electrical and controls engineers","count":5,"why":"Design panels, protection and automation."},{"role":"Mechanical and fixture engineers","count":3,"why":"Adapt the station to the pack."},{"role":"Assembly and wiring technicians","count":8,"why":"Build panels and complete machines."},{"role":"Quality and calibration","count":3,"why":"Verify measurements and acceptance records."},{"role":"Field commissioning and service","count":4,"why":"Install and support customer equipment."},{"role":"Purchasing, planning and administration","count":4,"why":"Control bought-in equipment and project cash."}],"teamNote":"34 people for one-shift assembly and a small field-service team. Specialist safety reviews and accredited calibration services are additional.","machines":[{"name":"Engineering and software workstations","quantity":"8–10 shared workstations","purpose":"Design the station and test sequences.","spec":"Electrical CAD, mechanical CAD, version control and test-software licensing sized to the team.","sourceIds":["TST1","TST2"]},{"name":"Wire preparation and panel benches","quantity":"2 build cells","purpose":"Prepare wiring and assemble electrical cabinets.","spec":"Supported conductor sizes, calibrated crimp tooling, torque logging and drawing control.","sourceIds":["TST3"]},{"name":"Mechanical assembly tools and lifting aids","quantity":"2 bays","purpose":"Assemble outsourced frames and fixtures.","spec":"Working envelope and lifting ratings matched to the machine and pack; no full machining shop assumed.","sourceIds":[]},{"name":"Regenerative power reference rack","quantity":"1–2 development units","purpose":"Exercise and verify station power functions.","spec":"Select voltage, current, transient response and grid interface from the first customer specification.","sourceIds":["TST2"]},{"name":"Insulation and measurement instrument set","quantity":"2 sets","purpose":"Measure electrical parameters and verify test channels.","spec":"Accuracy, uncertainty, isolation and traceable calibration; protected measurement circuits.","sourceIds":["TST2","TST3"]},{"name":"Leak-test reference and master parts","quantity":"1 set","purpose":"Develop and verify the optional leak test.","spec":"Pressure range, sensitivity and reference leaks agreed with the pack customer.","sourceIds":["TST1"]},{"name":"Battery/BMS simulator and communication bench","quantity":"2 benches","purpose":"Test software before connecting a real pack.","spec":"Customer CAN/diagnostic definitions, permitted fault simulation and version-controlled interfaces.","sourceIds":["TST1","TST2"]},{"name":"Guarded factory-acceptance bay","quantity":"2 bays","purpose":"Test the complete machine before shipment.","spec":"Interlocks, isolation, safe discharge, emergency stops and site-specific risk assessment.","sourceIds":["TST3"]}],"process":[{"name":"Agree the test contract","plain":"Define what a good pack must pass.","detail":"Receive the pack drawing, communication definitions, takt target and factory interfaces.","check":"Buyer signs the test matrix and acceptance criteria.","machine":"Engineering workstations","sourceIds":["TST1"]},{"name":"Design the station","plain":"Translate the checks into a machine.","detail":"Specify instruments, fixture, protection, software and result records.","check":"Design and safety review completed before long-lead orders.","machine":"Engineering workstations","sourceIds":["TST2","TST3"]},{"name":"Build the hardware","plain":"Assemble the frame, panels and test fixture.","detail":"Inspect outsourced mechanical parts and integrate bought-in equipment.","check":"Wiring, torque, protective bonding and component identity verified.","machine":"Panel benches; mechanical assembly bays","sourceIds":["TST3"]},{"name":"Develop the test sequence","plain":"Teach the machine the approved checks.","detail":"Use a simulator to exercise BMS messages, recipe handling and traceability.","check":"Known pass and fail cases produce the correct result.","machine":"BMS simulator and engineering workstations","sourceIds":["TST1","TST2"]},{"name":"Calibrate and prove the machine","plain":"Show that its measurements are trustworthy.","detail":"Verify measurement uncertainty, repeatability, interlocks and the customer's golden samples.","check":"Factory-acceptance record signed against the contract.","machine":"Instrument set; guarded test bay","sourceIds":["TST2","TST3"]},{"name":"Commission and support","plain":"Install it on the buyer's line.","detail":"Connect the approved factory interfaces, train operators and establish spares and software support.","check":"Site acceptance and repeatable production cycle demonstrated.","machine":"Complete delivered test station","sourceIds":["TST1"]}],"modelParts":[{"name":"Pack fixture","meaning":"Holds and connects the battery under test."},{"name":"Power rack","meaning":"Charges or discharges the pack during the agreed checks."},{"name":"Measurement cabinet","meaning":"Measures electrical values and insulation."},{"name":"Communication controller","meaning":"Talks to the battery's management system."},{"name":"Guarded enclosure","meaning":"Separates people from live testing."},{"name":"Results terminal","meaning":"Links the verdict to a pack serial number."}],"roadmap":[{"phase":"Choose the first programme","duration":"Months 0–2","actions":"Obtain the pack specification and paid engineering or prototype scope.","gate":"Test contract and customer decision owner identified."},{"phase":"Build the architecture","duration":"Months 2–4","actions":"Select instrument partners and prototype software using a simulator.","gate":"Design review and instrument quotations accepted."},{"phase":"Build a demonstrator","duration":"Months 4–7","actions":"Fit out the bays and assemble the first machine.","gate":"Known faults are detected and measurements are repeatable."},{"phase":"Complete first customer acceptance","duration":"Months 7–10","actions":"Perform factory and site acceptance; train the customer.","gate":"Signed acceptance and initial service evidence."},{"phase":"Repeat the platform","duration":"Months 10–15+","actions":"Reuse validated modules on further customer variants.","gate":"Predictable build hours, service response and project margins."}],"quality":[{"title":"Measurement capability","detail":"Specify calibration, uncertainty and repeatability for every important channel. A calibrated instrument alone does not validate the assembled station.","sourceIds":["TST2","TST3"]},{"title":"Equipment safety","detail":"Determine applicable IEC 61010 requirements and any machinery-specific requirements with the conformity specialist. Validate guards, isolation and safe failure behaviour for the finished system.","sourceIds":["TST3"]},{"title":"Customer acceptance","detail":"Pass factory and site acceptance using agreed reference packs and known defects; establish software-change control and retrievable records.","sourceIds":["TST1","TST2"]}],"localisation":[{"part":"Machine architecture, software, panels and integration","route":"Make in India","detail":"Core engineering and service value is created locally."},{"part":"Frames, cabinets and fixtures","route":"Outsource","detail":"Use Indian sheet-metal and machining suppliers."},{"part":"Regenerative converters and precision instruments","route":"Import initially","detail":"Qualify Indian substitutes where performance is equivalent; no claim of fully indigenous instruments."},{"part":"Cables, standard panels and support items","route":"Buy Indian","detail":"Purchase qualified local parts where specifications permit."}],"schemes":[{"name":"ECMS capital equipment category","status":"Category D application window shown open until 30 April 2027 as checked on 20 September 2026.","detail":"Electronics-manufacturing equipment eligibility must be confirmed for the exact product. The ₹10 crore minimum eligible investment exceeds this starter fixed-investment estimate; do not assume a grant or count working capital towards it.","sourceIds":["TST4","TST5"]}],"network":"Seek introductions to pack manufacturing engineering, plant quality and sourcing teams, plus ARAI or other relevant test experts. The useful outcome is a paid engineering project with a signed acceptance specification; political access does not validate a machine.","risks":[{"risk":"Every order becomes a new engineering project.","response":"Limit the launch to one voltage/application family and reuse modules."},{"risk":"A missed defect causes customer losses.","response":"Contract the test coverage, validate known failures and control software changes."},{"risk":"Imported instruments delay delivery.","response":"Freeze the bill of material early and qualify alternate channels."},{"risk":"Receivables absorb the company's cash.","response":"Use engineering, factory-acceptance and shipment milestones."}],"first90":["Obtain two real pack test matrices and compare their common requirements.","Recruit an experienced test architect and confirm instrument support in India.","Build a simulator-based demonstration of diagnosis and serialised results.","Quote a paid pilot with explicit acceptance criteria and milestones."],"sources":[{"id":"TST1","title":"EOL testing modules and packs","url":"https://adordigatron.com/eol-testing-modules-packs/","publisher":"Ador Digatron","date":"Accessed 20 September 2026","supports":"Existing Indian offering of modular electrical, leak and BMS testing with production traceability; not a price benchmark.","type":"Company"},{"id":"TST2","title":"Battery Pack Automated Test System 8720","url":"https://www.chromausa.com/product/battery-pack-ats-model-8720/","publisher":"Chroma Systems Solutions","date":"Accessed 20 September 2026","supports":"Commercial EOL test architecture and configurable battery electrical/communication checks; proposed rating remains our scope choice.","type":"Company"},{"id":"TST3","title":"IEC 61010-1:2010","url":"https://webstore.iec.ch/en/publication/4279","publisher":"International Electrotechnical Commission","date":"10 June 2010; accessed 20 September 2026","supports":"Safety framework for electrical measurement and control equipment; detailed applicability requires the current applicable editions.","type":"Standard"},{"id":"TST4","title":"ECMS guidelines","url":"https://ecms.meity.gov.in/documents/ECMS%20Guidelines_26.04.2025.pdf","publisher":"MeitY","date":"2025; accessed 20 September 2026","supports":"Capital equipment category and investment conditions; the proposed business has not obtained approval.","type":"Government"},{"id":"TST5","title":"ECMS application portal","url":"https://ecms.meity.gov.in/","publisher":"MeitY","date":"Accessed 20 September 2026","supports":"Current category D application-window notice.","type":"Government"},{"id":"TST6","title":"Five technical challenges for battery-pack EOL test stations","url":"https://www.chroma.com.cn/cn/blog/application_note_battery_pack_eol_test","publisher":"Chroma ATE","date":"22 June 2022; accessed 20 September 2026","supports":"Distinction between cell/module/in-line and finished-pack testing; no full formation-line scope assumed.","type":"Company"}],"researchNote":"Sources establish equipment functions and existing suppliers. The factory layout, team, budget, capacity and timeline are planning assumptions. No customer test recipe, purchase order, instrument quotation or certification scope has been obtained.","teamTotal":34,"factoryNote":"This is a proposed starter-factory configuration, not a vendor-engineered plant. Product ratings, permits, layout and utility connections must be confirmed before investment."},{"id":"advanced-pcb","title":"Multilayer and entry-HDI printed circuit boards","shortTitle":"Advanced PCBs","sector":"Electronics manufacturing","plain":"This factory makes the bare boards on which electronic components are later mounted. Copper tracks and small plated holes connect several layers inside each board.","analogy":"A multilayer road network for electrical signals, with tiny vertical connections between the floors.","product":"Customer-designed, electrically tested 8–12-layer rigid boards, including one sequential HDI build-up where needed.","does":"Gives electronics manufacturers a qualified Indian source for compact, controlled-impedance boards and local support when designs change.","customers":["Telecom and industrial electronics manufacturers","Server auxiliary-board and interface-board manufacturers","EMS companies purchasing customer-approved bare boards","Power and embedded-system OEMs needing multilayer boards"],"whyNow":"Equipment and chemistry suppliers support integrated HDI manufacturing [PCB1–PCB3]. AT&S reports continuing HDI qualification at Nanjangud [PCB5], demonstrating a Karnataka manufacturing base. This is a selective replacement of imported board designs, not proof that every advanced board is imported or that all AI server boards fit this line.","firstProduct":"8–12-layer rigid controlled-impedance PCBs, with an optional 1+N+1 construction: one additional fine-interconnect layer on each side of a multilayer core. Start with industrial, telecom and server auxiliary/interface applications on a small set of approved materials.","notIncluded":"IC package substrates, ABF or glass-core substrates, flagship GPU baseboards requiring substantially higher layer counts, any-layer smartphone HDI, flexible boards and component assembly. Expanding to those products requires another capability and investment assessment.","entry":"Form a technical partnership with an experienced bare-PCB operator, not only an equipment seller. Transfer stack-up design, chemical control, yield improvement and customer qualification methods. Secure several repeat board programmes before freezing line capacity.","capacity":"Planning case: approximately 4,000 square metres of saleable finished boards per month at maturity, two shifts over roughly 250 production days yearly. Panel utilisation, layer count, product mix and yield determine the true output.","budget":{"basis":"INR crore, 2026 pre-feasibility allowances for a leased, structurally suitable industrial shell. Land, new building construction and recoverable GST excluded. No incentives netted; working capital separate.","items":[{"name":"Inner/outer-layer preparation, etching and handling","low":12,"high":23,"note":"Integrated wet-process and resist-handling equipment; planning range."},{"name":"Imaging, drilling and registration","low":20,"high":36,"note":"Direct imaging, mechanical and laser drilling, registration and automation."},{"name":"Vacuum lamination system","low":7,"high":12,"note":"Pressing, lay-up and supporting thermal equipment."},{"name":"Desmear and copper metallisation/plating","low":14,"high":25,"note":"Critical wet chemistry and copper-build process."},{"name":"Solder mask, finishing and profiling","low":9,"high":16,"note":"Mask coating/imaging/cure, OSP finishing and routing; specialist precious-metal finishing outsourced initially."},{"name":"Inspection and reliability laboratory","low":5,"high":9,"note":"AOI, electrical test, impedance measurement, microsections and process laboratory."},{"name":"Environmental systems and shell fit-out","low":14,"high":25,"note":"Effluent treatment, water reuse, extraction, DI water, HVAC, power and chemical segregation."},{"name":"Technology transfer, trials and launch","low":6,"high":12,"note":"Engineering team mobilisation, process trials and customer qualification; unquoted provisional allowance."},{"name":"Contingency","low":12,"high":22,"note":"Integration, commissioning and yield-ramp changes."}],"workingLow":12,"workingHigh":25,"workingNote":"Separate allowance for laminates, copper, chemicals, trial scrap and receivables. Early yield losses and lengthy customer approvals require a detailed cash-flow model.","landNote":"No land purchase or new shell construction included. Suitable chemical-processing premises may require more civil work than this allowance; approve the site before signing a lease.","confidence":"Low-to-medium confidence screening estimate, not a bankable project cost. Obtain an integrated line quotation, mass/water balance and customer product mix.","totalLow":99,"totalHigh":180,"fundingLow":111,"fundingHigh":205},"site":{"builtup":"Assume 90,000 sq ft, approximately 8,360 sq m, of suitable industrial space.","plot":"Greenfield alternative: screen 3–5 acres; treatment plant, chemicals, setbacks and future expansion determine the final area.","power":"Screen 1.5–3 MVA connected/supply capacity. Presses, wet lines, extraction, chillers and HVAC require a detailed load study.","water":"Screen 50–120 kilolitres/day of fresh make-up at mature output with engineered reuse; actual circulation is higher. Confirm source-water quality and a vendor water balance before site selection.","conditions":["Segregate corrosive wet processing, clean imaging and dry drilling areas.","Provide bunded chemical storage, extracted process lines and an engineered effluent-treatment/reuse system.","Obtain the applicable environmental consents and disposal arrangements before operating chemical processes.","Plan corrosion-resistant services, maintenance access and material flow around large process lines."],"areas":[{"name":"Wet chemical processing","share":28,"why":"Etch, clean, metallise and plate panels."},{"name":"Imaging and clean handling","share":15,"why":"Protect fine circuit patterns."},{"name":"Lamination and drilling","share":18,"why":"Build and connect the layers."},{"name":"Mask, profiling and testing","share":14,"why":"Finish and inspect boards."},{"name":"Utilities and environmental treatment","share":15,"why":"Supply water/air and treat waste."},{"name":"Stores, engineering and support","share":10,"why":"Control materials and customer jobs."}]},"team":[{"role":"Plant, production and programme leadership","count":4,"why":"Coordinate two shifts and customer deliveries."},{"role":"Process and manufacturing engineers","count":12,"why":"Control imaging, lamination, drilling and wet chemistry."},{"role":"CAM and customer engineering","count":6,"why":"Convert designs into producible panels and stack-ups."},{"role":"Quality and laboratory staff","count":12,"why":"Inspect layers, test boards and analyse defects."},{"role":"Production operators","count":56,"why":"Run the line across two shifts."},{"role":"Maintenance and utilities","count":10,"why":"Maintain equipment and treatment systems."},{"role":"Environment, chemistry and safety","count":6,"why":"Manage chemicals, waste and permits."},{"role":"Stores, purchasing, sales and administration","count":10,"why":"Manage materials and customer programmes."}],"teamNote":"116 people at two-shift maturity, including day-shift engineering and support. The technology partner's setup specialists and construction contractors are additional.","machines":[{"name":"Direct imaging and resist-processing line","quantity":"2 imaging systems plus shared preparation/etch equipment","purpose":"Create the copper circuit patterns.","spec":"Panel format, minimum feature size, registration and resist system selected for the approved board family.","sourceIds":["PCB2"]},{"name":"Automatic optical inspection","quantity":"2 systems","purpose":"Find circuit-pattern defects before layers are buried.","spec":"Resolution, defect library and panel handling matched to the design rules.","sourceIds":["PCB4"]},{"name":"Vacuum lamination system","quantity":"1 press line","purpose":"Bond copper and insulating layers into a stack.","spec":"Press area, heating/cooling uniformity and material-qualified cycle; no universal temperature recipe.","sourceIds":["PCB3"]},{"name":"Mechanical and laser drilling with registration","quantity":"2 mechanical drill systems, 1 laser system, 1 registration unit","purpose":"Make through holes and small blind connections.","spec":"Hole sizes, aspect ratios, layer alignment and panel throughput must be demonstrated on the actual laminate.","sourceIds":["PCB2"]},{"name":"Desmear, metallisation and copper-plating lines","quantity":"1 integrated process set","purpose":"Clean holes and create reliable copper connections.","spec":"Chemistry compatibility, bath monitoring, throwing power and via-fill capability against approved test coupons.","sourceIds":["PCB1"]},{"name":"Outer pattern, solder-mask and finishing line","quantity":"1 set","purpose":"Protect the circuit and prepare exposed pads.","spec":"Mask registration and cure, OSP compatibility; outsource qualified ENIG/ENEPIG finishing initially.","sourceIds":["PCB1","PCB2"]},{"name":"Routing and electrical-test systems","quantity":"1 router and 2 test systems","purpose":"Separate boards and check electrical networks.","spec":"Flying-probe versus dedicated fixtures chosen by mix; include controlled-impedance coupons.","sourceIds":["PCB2","PCB4"]},{"name":"Microsection and process laboratory","quantity":"1 laboratory","purpose":"Inspect internal copper joints and monitor chemistry.","spec":"Sample preparation, microscopy, analytical equipment and outsourced specialist reliability tests.","sourceIds":["PCB4"]},{"name":"DI water, extraction and effluent-treatment systems","quantity":"1 engineered utility set","purpose":"Support the wet processes and manage waste.","spec":"Supplier mass balance, local discharge conditions, chemical inventory and water reuse determine size.","sourceIds":["PCB1"]}],"process":[{"name":"Engineer the customer's board","plain":"Check that the design can be made reliably.","detail":"Create the stack-up, panel layout, tooling data and inspection coupons.","check":"Customer approves materials, impedance and fabrication rules.","machine":"CAM engineering tools","sourceIds":["PCB4"]},{"name":"Pattern and inspect inner layers","plain":"Make the copper tracks inside the board.","detail":"Image and etch copper-clad cores; inspect before covering them.","check":"No unacceptable opens, shorts or pattern defects.","machine":"Direct imaging line; automatic optical inspection","sourceIds":["PCB2"]},{"name":"Build the multilayer stack","plain":"Press the layers together.","detail":"Align copper layers and insulating sheets, then laminate under a qualified cycle.","check":"Thickness, registration and bond integrity accepted.","machine":"Vacuum lamination system","sourceIds":["PCB3"]},{"name":"Create vertical connections","plain":"Drill holes between selected layers.","detail":"Use mechanical and laser drilling; the HDI build-up repeats the relevant lamination/interconnect stages.","check":"Hole geometry and alignment satisfy the process window.","machine":"Drilling and registration systems","sourceIds":["PCB2"]},{"name":"Clean and metallise the holes","plain":"Make the holes electrically conductive.","detail":"Remove drilling residue and deposit/build copper using the qualified chemistry.","check":"Copper coverage, thickness and coupon sections accepted.","machine":"Desmear, metallisation and plating lines","sourceIds":["PCB1"]},{"name":"Complete and protect the outer circuit","plain":"Finish the board's surface.","detail":"Form outer tracks, inspect, apply solder mask and the approved pad finish.","check":"Mask, surface finish and external features meet the drawing.","machine":"Outer pattern and finishing line","sourceIds":["PCB1","PCB2"]},{"name":"Test, profile and release","plain":"Check the finished board and cut its outline.","detail":"Test networks, sample impedance and reliability coupons; profile and pack accepted boards.","check":"Customer quality class and lot records satisfied.","machine":"Electrical-test systems; router; laboratory","sourceIds":["PCB4"]}
