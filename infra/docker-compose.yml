# Local infra for the XELOR MVP prototype.
# Images pinned to the DECISIONS-V2 Appendix A baseline (July-2026 versions).
# Run:  docker compose -f infra/docker-compose.yml up -d
name: ind-core

services:
  # PostgreSQL 17 + pgvector (DECISIONS-V2 §1.6, §2). The pgvector image tracks PG17.
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: indcore
      # The container superuser bootstraps roles; the app never uses it.
      POSTGRES_USER: indcore_owner
      POSTGRES_PASSWORD: owner_pw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # init scripts run once, in filename order, on first boot:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indcore_owner -d indcore"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Valkey (cache + BullMQ). BSD-licensed Redis drop-in (DECISIONS-V2 §2).
  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Keycloak 26 (DECISIONS-V2 §1.5). Dev mode only for local. Imports the indcore
  # realm on boot (realm, indcore-api client, trishul/kaveri groups + demo users).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    # The three `spi-theme-*` flags are what make theme editing actually iterative.
    # `start-dev` alone does NOT do it: measured, a stylesheet edit was still being served
    # from the copy Keycloak read at boot, so every CSS change silently required a container
    # restart and looked like the change had had no effect. Templates and themes off, and a
    # static max-age of -1 so the browser is not told to hold the old file either.
    command:
      [
        "start-dev",
        "--import-realm",
        "--features=organization",
        "--http-port=8080",
        "--spi-theme-static-max-age=-1",
        "--spi-theme-cache-themes=false",
        "--spi-theme-cache-templates=false",
      ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # The XELOR sign-in theme: the dark glass form and the revolving factory behind it.
      # Mounted as a SIBLING inside /opt/keycloak/themes rather than over the whole folder —
      # the built-in `base`, `keycloak` and `keycloak.v2` themes live there too, and this one
      # inherits from `keycloak.v2`, so hiding them would take the parent down with them.
      #
      # `start-dev` disables theme caching, so edits to the CSS are picked up on reload with
      # no restart. Editing the JS still means re-running `build-login-theme` first.
      - ./keycloak-themes/indcore:/opt/keycloak/themes/indcore:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Gotenberg (HTML -> PDF via headless Chromium), DECISIONS-V2 §2.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: ["gotenberg", "--api-port=3001"]
    ports:
      # Host 3001 belongs to the XELOR web app. Keep Gotenberg's container API on 3001,
      # but publish it separately so both services can run during the investor demo.
      - "3002:3001"

volumes:
  pgdata:
