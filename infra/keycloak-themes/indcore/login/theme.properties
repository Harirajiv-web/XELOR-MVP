# ═══════════════════════════════════════════════════════════════════════════════
# XELOR sign-in theme.
# ═══════════════════════════════════════════════════════════════════════════════
#
# Inherits everything from Keycloak's own `keycloak.v2` login theme and changes two things:
# the surface it is painted on, and the factory turning behind it. No FreeMarker template is
# overridden. That is deliberate — a copied `login.ftl` is a fork of Keycloak's security
# surface, and it silently stops receiving upstream fixes to the very form that takes
# passwords. Everything here is a stylesheet and a script, so a Keycloak upgrade brings its
# own template improvements with it and this theme simply repaints them.
parent=keycloak.v2
import=common/keycloak

# `styles` OVERRIDES the parent's value rather than extending it, so the parent's own
# stylesheet has to be named again here or the form arrives unstyled. `css/styles.css`
# resolves through inheritance to keycloak.v2's file; `css/indcore.css` is ours, and it is
# last so it wins.
styles=css/styles.css css/indcore.css

# The BLOCKING head script — see the reasoning block in `login-loader.ts`. This must stay
# pointed at the loader and never at `backdrop.js`: the parent template renders these tags
# without `defer`, so whatever is named here stands between a person and the login form.
scripts=js/backdrop-loader.js
